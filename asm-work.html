<style>
/* 🤝 รวมงาน ASM — ลิงก์ให้เพื่อนสาขาที่รวมงาน (ไม่ต้องล็อกอิน SUPER APP) */
:root{ --y:#FFD600; --d:#1C1C1E; --ok:#16A34A; --no:#E5484D; --warn:#F59E0B; --ios-ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;overflow-x:hidden}
body{min-height:100vh;color:var(--d);font-family:'IBM Plex Sans Thai',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 55% at 50% -12%,#FFF3A6 0%,rgba(255,243,166,0) 60%),var(--y);background-attachment:fixed;padding:calc(10px + env(safe-area-inset-top)) 12px 30px}
button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0}
button:focus{outline:none}
.wrap{max-width:1100px;margin:0 auto}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes abBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{flex:1;margin:0;font:800 22px/1.15 'Kanit',sans-serif;min-width:0}.top h1 small{display:block;font:600 12px 'IBM Plex Sans Thai',sans-serif;color:rgba(28,28,30,.6)}
.tb{border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px;background:var(--d);color:var(--y);transition:transform .3s var(--spring)}
.tb:active{transform:scale(.92)} .tb.w{background:#fff;color:var(--d)} .tb.spin span{display:inline-block;animation:spin .8s linear infinite}
.ttl{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ttl input{flex:1;min-width:0;background:var(--d);color:var(--y);border:0;border-radius:16px;padding:13px 16px;font:700 17px 'Kanit',sans-serif;box-shadow:0 10px 22px -12px rgba(0,0,0,.6)}
.ttl input:focus{outline:2px solid #fff}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.6);padding:5px;border-radius:18px;margin-bottom:12px}
.tabs button{flex:1;height:44px;border-radius:14px;font-weight:700;font-size:14.5px;transition:background .3s,color .3s}
.tabs button.on{background:var(--d);color:var(--y);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.card{background:#FFFDF5;border-radius:22px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px -12px rgba(60,48,0,.55);animation:rise .4s var(--ios-ease) both}
.card h3{margin:0 2px 4px;font:700 16px 'Kanit',sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font:600 12px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73}
.card p.h{margin:0 2px 10px;font-size:12.5px;color:#6E6E73;font-weight:600;line-height:1.55}
.prog{display:flex;align-items:center;gap:14px;background:var(--d);color:#fff;border-radius:22px;padding:14px;margin-bottom:10px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px 'Kanit',sans-serif;color:var(--y)}
.prog .n{flex:1}.prog .n small{display:block;font-size:12px;color:#AEAEB2;font-weight:700}.prog .n big{font:800 32px 'Kanit',sans-serif}.prog .n big span{font-size:18px;color:#8E8E93}
.kp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.kp div{background:rgba(255,255,255,.08);border-radius:12px;padding:7px 9px;font-size:11px;font-weight:700;color:#D1D1D6}
.kp b{display:block;font:700 19px 'Space Grotesk',sans-serif}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border-radius:100px;padding:8px 13px;background:rgba(255,255,255,.75);font-weight:700;font-size:13px}
.chips button.on{background:var(--d);color:var(--y)} .chips i{font-style:normal;opacity:.6;margin-left:4px}
.list{display:grid;grid-template-columns:1fr;gap:7px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.br{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#FFFDF5;border-radius:16px;padding:11px 12px;animation:rise .4s var(--ios-ease) both;box-shadow:0 4px 14px -10px rgba(60,48,0,.5)}
.br .id{background:var(--d);color:var(--y);font:700 12px 'Space Grotesk',sans-serif;border-radius:9px;padding:5px 8px}
.br .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12.5px;font-weight:800;border-radius:100px;padding:7px 12px;white-space:nowrap;transition:transform .3s var(--spring)}
.st:active{transform:scale(.9)} .st.ok{background:#DCFCE7;color:#15803D} .st.no{background:#FFE4E6;color:#BE123C} .st.warn{background:#FFF1D6;color:#8A5300}
.st.pop{animation:pop .4s var(--spring)} @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bar .tb{flex:1;min-width:140px;height:48px;font-size:14px}
.tb.go{flex:2;font-size:15px}.tb.go:disabled{opacity:.35}.tb.save{background:var(--ok);color:#fff;flex:2}.tb.ghost{background:#F2F2F7;color:var(--d)}.tb.red{background:#fff;color:#BE123C}
.hint{text-align:center;font-size:12px;color:rgba(28,28,30,.6);font-weight:600;margin:8px 0}
.paste{width:100%;min-height:84px;border:2px dashed rgba(28,28,30,.25);border-radius:16px;background:#fff;padding:12px;font:600 14px 'IBM Plex Sans Thai',sans-serif;resize:vertical}
.paste:focus{outline:none;border-color:var(--d)}
.meta{font-size:12px;color:#6E6E73;font-weight:700;margin:8px 2px 0}
.pick{display:flex;align-items:center;gap:10px;background:var(--d);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13px;font-weight:700;flex-wrap:wrap}
.pick b{color:var(--y);font-size:15px}.pick .tip{flex:1;color:#AEAEB2;font-weight:600;font-size:12px;text-align:right}
.grid{overflow:auto;max-height:54vh;border-radius:14px;background:#fff;border:1px solid #EEE;-webkit-overflow-scrolling:touch}
.grid table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid #F0F0F0;border-right:1px solid #F5F5F5;white-space:nowrap;text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.grid thead th{position:sticky;top:0;z-index:2;background:#1C1C1E;color:#fff;font-weight:700;cursor:pointer}
.grid thead th small{display:block;font:700 10px 'Space Grotesk',sans-serif;color:#8E8E93}
.grid th.sel{background:var(--y);color:var(--d)}.grid th.sel small{color:rgba(28,28,30,.6)}.grid td.sel{background:#FFF7C7;font-weight:700}
.grid td.rn,.grid th.rn{position:sticky;left:0;background:#FAFAFA;color:#AEAEB2;z-index:1;cursor:default}.grid thead th.rn{background:#1C1C1E;z-index:3}
.grid tr.zin td.rn{color:var(--d);font-weight:700;box-shadow:inset 3px 0 0 var(--y)}
.rk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}.rk div{border-radius:16px;padding:11px;background:#fff}
.rk small{display:block;font-size:12px;font-weight:700;color:#6E6E73}.rk b{font:800 28px 'Kanit',sans-serif}.rk .ok b{color:#15803D}.rk .no b{color:#BE123C}
.rr{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;animation:rise .4s var(--ios-ease) both}
.rr .id{background:var(--d);color:var(--y);font:700 12px 'Space Grotesk',sans-serif;border-radius:9px;padding:5px 8px}
.rr .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rr .nm small{display:block;font-size:11.5px;color:#8E8E93;font-weight:600}
.empty{text-align:center;padding:26px 10px;color:#6E6E73;font-weight:700;font-size:14px}
@media (min-width:980px){.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:12px;align-items:start}}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;padding:10px}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#F2F2F7;border-radius:26px;padding:16px;animation:rise .35s var(--ios-ease) both}
.ft{display:flex;gap:8px;margin-top:12px}.ft button{flex:1;height:48px;border-radius:15px;font-weight:700;background:#fff}.ft .ok{background:var(--d);color:var(--y)}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,200%);background:var(--d);color:#fff;padding:11px 18px;border-radius:100px;font-weight:700;font-size:13.5px;z-index:99;max-width:90vw;text-align:center;opacity:0;transition:transform .45s var(--spring),opacity .25s}
#toast.on{transform:translate(-50%,0);opacity:1}
.about{text-align:center;padding:6px 4px 2px}.about .lg{font-size:46px;animation:abBob 2.4s ease-in-out infinite}
@keyframes abBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.about h3{font-size:19px!important;margin:4px 0 2px!important}.about .by{display:inline-block;background:var(--d);color:var(--y);border-radius:100px;padding:6px 14px;font-weight:700;font-size:13px;margin:6px 0 12px}
.about .msg{background:#fff;border-radius:18px;padding:14px;font-size:14px;line-height:1.7;font-weight:600;color:#3A3A3C;text-align:left}
.about .fight{font-size:16px;font-weight:700;margin-top:12px;color:#1C1C1E}
.credit{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:11px 14px;border-radius:18px;background:linear-gradient(135deg,#1C1C1E,#3A3A3C);color:#fff;text-align:left;box-shadow:0 8px 22px -12px rgba(0,0,0,.6);position:relative;overflow:hidden}
.credit::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,214,0,.28) 50%,transparent 65%);transform:translateX(-100%);animation:crShine 3.6s ease-in-out infinite}
@keyframes crShine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.credit .ic{font-size:26px;animation:abBob 2.4s ease-in-out infinite}.credit .tx{flex:1;min-width:0}
.credit b{display:block;font-size:15px;color:#FFD600;letter-spacing:.2px}.credit small{display:block;font-size:11px;color:#D1D1D6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit .i{font-size:11px;font-weight:700;background:rgba(255,214,0,.18);color:#FFD600;border-radius:100px;padding:4px 9px;flex-shrink:0}
.foot-cr{text-align:center;font-size:11.5px;font-weight:700;color:rgba(28,28,30,.55);margin:18px 0 6px}
.about .cp{font-size:11px;color:#8E8E93;font-weight:600;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 🚀 ZK เช็คงานจากชีต (ใช้ร่วม asm.html / asm-work.html) */
.zk *{box-sizing:border-box}
.zk-two{display:block}
@media (min-width:980px){.zk-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:12px;align-items:start}}
.zk-card{background:#FFFDF5;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px -14px rgba(60,48,0,.55);animation:zkRise .4s cubic-bezier(.32,.72,0,1) both}
@keyframes zkRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.zk-card h3{margin:0 2px 4px;font:700 16px 'Kanit','IBM Plex Sans Thai',sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.zk-card h3 small{font:600 12px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73}
.zk-card p.h{margin:0 2px 10px;font:600 12.5px/1.55 'IBM Plex Sans Thai',sans-serif;color:#6E6E73}
.zk-paste{width:100%;min-height:80px;border:2px dashed rgba(28,28,30,.25);border-radius:16px;background:#fff;padding:12px;font:600 14px 'IBM Plex Sans Thai',sans-serif;resize:vertical;color:#1C1C1E}
.zk-paste:focus{outline:none;border-color:#1C1C1E}
.zk-opt{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px;font:700 13px 'IBM Plex Sans Thai',sans-serif}
.zk-opt .in{display:flex;gap:6px;min-width:0;flex-wrap:wrap}
.zk-opt select{flex:1;min-width:120px;height:42px;border-radius:12px;border:0;background:#F2F2F7;padding:0 10px;font:600 13.5px 'IBM Plex Sans Thai',sans-serif;color:#1C1C1E}
.zk-opt select.on{background:#1C1C1E;color:#FFD600}
.zk-seg{display:flex;gap:4px;background:#F2F2F7;border-radius:12px;padding:4px;flex:1}
.zk-seg button{flex:1;border:0;border-radius:9px;padding:9px 6px;font:700 12.5px 'IBM Plex Sans Thai',sans-serif;background:none;color:#6E6E73;cursor:pointer}
.zk-seg button.on{background:#1C1C1E;color:#FFD600}
@media (max-width:520px){.zk-opt{grid-template-columns:1fr;gap:5px}}
.zk-pick{display:flex;align-items:center;gap:10px;background:#1C1C1E;color:#fff;border-radius:14px;padding:10px 12px;margin:4px 0 10px;font:700 13px 'IBM Plex Sans Thai',sans-serif;flex-wrap:wrap}
.zk-pick b{color:#FFD600;font-size:15px}.zk-pick .tip{flex:1;color:#AEAEB2;font-weight:600;font-size:12px;text-align:right}
.zk-grid{overflow:auto;max-height:52vh;border-radius:14px;background:#fff;border:1px solid #EEE;-webkit-overflow-scrolling:touch}
.zk-grid table{border-collapse:separate;border-spacing:0;font:500 12.5px 'IBM Plex Sans Thai',sans-serif;min-width:100%;color:#1C1C1E}
.zk-grid th,.zk-grid td{padding:8px 10px;border-bottom:1px solid #F0F0F0;border-right:1px solid #F5F5F5;white-space:nowrap;text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.zk-grid thead th{position:sticky;top:0;z-index:2;background:#1C1C1E;color:#fff;font-weight:700;cursor:pointer}
.zk-grid thead th small{display:block;font:700 10px 'Space Grotesk',sans-serif;color:#8E8E93}
.zk-grid th.sel{background:#FFD600;color:#1C1C1E}.zk-grid th.sel small{color:rgba(28,28,30,.6)}
.zk-grid th.zk-hb{box-shadow:inset 0 -3px 0 #60A5FA}.zk-grid th.zk-ha{box-shadow:inset 0 -3px 0 #C084FC}
.zk-grid td.sel{background:#FFF7C7;font-weight:700}
.zk-grid td.rn,.zk-grid th.rn{position:sticky;left:0;background:#FAFAFA;color:#AEAEB2;z-index:1;cursor:default}.zk-grid thead th.rn{background:#1C1C1E;z-index:3}
.zk-grid tr.zin td.rn{color:#1C1C1E;font-weight:700;box-shadow:inset 3px 0 0 #FFD600}
.zk-grid tr.out td{color:#C7C7CC}.zk-grid tr.out td.sel{background:#FAFAFA;font-weight:500}
.zk-meta{font:700 12px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73;margin:8px 2px 0;line-height:1.5}
.zk-lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.zk-lg i{width:12px;height:4px;border-radius:2px;display:inline-block}
.zk-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.zk-btn{flex:1;min-width:120px;height:48px;border:0;border-radius:15px;font:700 14.5px 'IBM Plex Sans Thai',sans-serif;cursor:pointer;background:#F2F2F7;color:#1C1C1E;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.zk-btn:active{transform:scale(.95)}.zk-btn.go{background:#1C1C1E;color:#FFD600;flex:2}.zk-btn.go:disabled{opacity:.35}.zk-btn.save{background:#16A34A;color:#fff;flex:2}
.zk-k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}.zk-k div{border-radius:16px;padding:11px;background:#fff}
.zk-k small{display:block;font:700 12px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73}.zk-k b{font:800 28px 'Kanit',sans-serif}.zk-k .ok b{color:#15803D}.zk-k .no b{color:#BE123C}
.zk-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;animation:zkRise .4s cubic-bezier(.32,.72,0,1) both}
.zk-r .id{background:#1C1C1E;color:#FFD600;font:700 12px 'Space Grotesk',sans-serif;border-radius:9px;padding:5px 8px}
.zk-r .nm{font:700 13.5px 'IBM Plex Sans Thai',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1C1C1E}
.zk-r .nm small{display:block;font-size:11.5px;color:#8E8E93;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.zk-r .pb{grid-column:2/4;height:6px;border-radius:6px;background:#F2F2F7;overflow:hidden}.zk-r .pb i{display:block;height:100%;border-radius:6px;background:#16A34A}
.zk-st{font:800 12.5px 'IBM Plex Sans Thai',sans-serif;border-radius:100px;padding:6px 11px;white-space:nowrap}.zk-st.ok{background:#DCFCE7;color:#15803D}.zk-st.no{background:#FFE4E6;color:#BE123C}
.zk-empty{text-align:center;padding:24px 10px;color:#6E6E73;font:700 14px 'IBM Plex Sans Thai',sans-serif}

.zk-role{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px;font:700 13px 'IBM Plex Sans Thai',sans-serif;color:#1C1C1E}
@media (max-width:520px){.zk-role{grid-template-columns:1fr;gap:5px}}
.zk-role .in{display:flex;gap:6px;min-width:0}
.zk-cb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;border:0;border-radius:12px;background:#F2F2F7;padding:0 12px;font:700 13.5px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73;cursor:pointer;text-align:left}
.zk-cb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zk-cb i{font-style:normal;opacity:.6}
.zk-cb.on{background:#1C1C1E;color:#FFD600}.zk-cb.need{box-shadow:inset 0 0 0 2px #FFD600;color:#1C1C1E;background:#FFF7C7;animation:zkPulse 1.6s ease-in-out infinite}
@keyframes zkPulse{50%{box-shadow:inset 0 0 0 2px #F59E0B}}
.zk-role select{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:#1C1C1E;color:#FFD600;padding:0 10px;font:700 13.5px 'IBM Plex Sans Thai',sans-serif}
.zk-tg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 8px;font:700 12.5px 'IBM Plex Sans Thai',sans-serif;color:#6E6E73}
.zk-tg button{border:0;border-radius:100px;padding:7px 12px;font:700 12.5px 'IBM Plex Sans Thai',sans-serif;background:#F2F2F7;color:#1C1C1E;cursor:pointer}.zk-tg button.on{background:#1C1C1E;color:#FFD600}
.zk-pop{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:10px;animation:zkFade .2s both}
@keyframes zkFade{from{opacity:0}to{opacity:1}}
.zk-pop .bx{width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;background:#F2F2F7;border-radius:24px;padding:14px;animation:zkRise .35s cubic-bezier(.32,.72,0,1) both}
.zk-pop h4{margin:0 2px 8px;font:700 16px 'Kanit','IBM Plex Sans Thai',sans-serif;color:#1C1C1E;display:flex;justify-content:space-between;align-items:center}
.zk-pop h4 button{border:0;background:#fff;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer}

<body>
<div class="wrap">
  <div class="top"><h1>🤝 รวมงาน ASM<small id="sub">กำลังโหลด…</small></h1>
    <button class="tb" id="rf" onclick="load(true)"><span>↻</span></button></div>
  <button class="credit" onclick="openAbout()"><span class="ic">😎</span><span class="tx"><b>จัดทำโดย บอสตัน สุดหล่อ</b><small>เพื่อเพื่อนๆ สาขาในโซน · เบาภาระงานต่อวัน · สู้ๆ ครับ 💪</small></span><span class="i">ℹ️ About</span></button>
  <div class="ttl"><input id="ttl" placeholder="ชื่องาน เช่น โอนฟิล์มเสีย" onchange="saveTitle(this.value)" onkeydown="if(event.key==='Enter')this.blur()"></div>
  <div class="tabs"><button id="tb-s" class="on" onclick="tab('s')">📋 สถานะสาขา</button><button id="tb-c" onclick="tab('c')">🚀 เช็คงานจากชีต</button></div>

  <div id="v-s">
    <div class="prog"><div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle id="rc" cx="48" cy="48" r="40" fill="none" stroke="#FFD600" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3" style="transition:stroke-dashoffset .8s var(--ios-ease)"/></svg><b id="pct">0%</b></div>
      <div class="n"><small>สาขาที่ส่งงาน</small><big id="cnt">0 <span>/ 0</span></big><div class="kp"><div>✅ ส่งแล้ว<b id="kO" style="color:#4ADE80">0</b></div><div>❎ ยังไม่ส่ง<b id="kN" style="color:#FB7185">0</b></div><div>⚠️ ไม่พบ<b id="kW" style="color:#FBBF24">0</b></div></div></div></div>
    <div class="chips" id="flt"></div>
    <div class="list" id="list"><div class="empty">กำลังโหลด…</div></div>
    <div class="hint">แตะสถานะ = สลับ ส่งแล้ว ↔ ยังไม่ส่ง</div>
    <div class="bar"><button class="tb w" onclick="copyLine()">📋 สรุปส่งไลน์</button><button class="tb w" id="repBtn" onclick="copyRep()">🔗 ลิงก์ Report ให้หัวหน้า</button></div>
    <div class="bar"><button class="tb red" onclick="resetAll(this)">🔄 เริ่มงานใหม่ (ทุกสาขา = ยังไม่ส่ง)</button></div>
  </div>

  <div id="v-c" style="display:none"><div class="zk" id="zkRoot"></div></div>

</div>
<div class="sheet" id="sh" onclick="if(event.target===this)closeSh()"><div class="box" id="shBox"></div></div>
<div id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwmALqdO95c1UTHKNGhNIAvyDSercHbETyzd3aCivS_nmxgd6pZ5-iB50F0oHAlUwoyOg/exec';
const K = new URLSearchParams(location.search).get('k') || '';
let D = null, FLT = 'all', LAST_EDIT = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const vib = n => { try { navigator.vibrate && navigator.vibrate(n || 10); } catch (e) {} };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }
function closeSh() { $('sh').classList.remove('on'); }
function api(op, a) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', body: JSON.stringify({ fn: 'asmWork', args: [K, op, a] }) })
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error || 'ผิดพลาด'); if (r.data && r.data.status === 'error') throw new Error(r.data.message); return r.data; });
}
function load(manual) {
  if (!K) { $('list').innerHTML = '<div class="empty">ลิงก์ไม่ครบ — ขอลิงก์ใหม่จากเจ้าของแอป</div>'; $('sub').textContent = '⚠️ ลิงก์ไม่ครบ'; return; }
  if (manual) $('rf').classList.add('spin');
  api('get').then(d => { $('rf').classList.remove('spin'); setD(d); if (manual) toast('อัปเดตแล้ว'); })
    .catch(e => { $('rf').classList.remove('spin'); $('sub').textContent = '⚠️ ' + e.message; if (!D) $('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
}
function setD(d) {
  D = d; $('sub').textContent = (d.am || 'ZONE ASM') + (d.updated ? ' · อัปเดต ' + d.updated : '');
  if (document.activeElement !== $('ttl')) $('ttl').value = d.title || '';
  $('repBtn').style.display = d.reportKey ? '' : 'none';
  render(); if ($('v-c').style.display !== 'none') ZK.render();
}
const LBL = { ok: '✅ ส่งแล้ว', no: '❎ ยังไม่ส่ง', warn: '⚠️ ไม่พบสาขา' };
function render() {
  const T = D.tasks || [], c = { ok: 0, no: 0, warn: 0 }; T.forEach(t => c[t.k]++);
  const n = T.length, pct = n ? Math.round(c.ok / n * 100) : 0;
  $('pct').textContent = pct + '%'; $('rc').style.strokeDashoffset = 251.3 * (1 - pct / 100);
  $('cnt').innerHTML = `${c.ok} <span>/ ${n}</span>`; $('kO').textContent = c.ok; $('kN').textContent = c.no; $('kW').textContent = c.warn;
  $('flt').innerHTML = [['all', 'ทั้งหมด', n], ['no', 'ยังไม่ส่ง', c.no], ['ok', 'ส่งแล้ว', c.ok]].concat(c.warn ? [['warn', 'ไม่พบสาขา', c.warn]] : [])
    .map(([k, t, v]) => `<button class="${FLT === k ? 'on' : ''}" onclick="FLT='${k}';render()">${t}<i>${v}</i></button>`).join('');
  const L = T.filter(t => FLT === 'all' || t.k === FLT);
  $('list').innerHTML = L.length ? L.map((t, i) => `<div class="br" style="animation-delay:${Math.min(i * 30, 360)}ms"><span class="id">${esc(t.id)}</span><span class="nm">${esc(t.name)}</span><button class="st ${t.k}" onclick="toggle('${esc(t.id)}',this)">${LBL[t.k]}</button></div>`).join('')
    : `<div class="empty">${n ? 'ไม่มีสาขาในกลุ่มนี้ ✨' : 'ยังไม่มีรายชื่อสาขา — ให้เจ้าของแอปเพิ่มสาขาก่อน'}</div>`;
}
const TT = {};
function toggle(id, el) {
  const t = D.tasks.find(x => x.id === id); if (!t) return;
  t.k = t.k === 'ok' ? 'no' : 'ok'; LAST_EDIT = Date.now(); vib(12);
  el.className = 'st ' + t.k + ' pop'; el.textContent = LBL[t.k];
  const keep = FLT; FLT = 'all'; const c = { ok: 0, no: 0, warn: 0 }; D.tasks.forEach(x => c[x.k]++); FLT = keep;
  const n = D.tasks.length, pct = n ? Math.round(c.ok / n * 100) : 0;
  $('pct').textContent = pct + '%'; $('rc').style.strokeDashoffset = 251.3 * (1 - pct / 100); $('cnt').innerHTML = `${c.ok} <span>/ ${n}</span>`; $('kO').textContent = c.ok; $('kN').textContent = c.no;
  clearTimeout(TT[id]); TT[id] = setTimeout(() => api('set', { id, k: t.k }).then(d => { if (Date.now() - LAST_EDIT > 1500) setD(d); }).catch(e => toast('⚠️ บันทึกไม่สำเร็จ: ' + e.message)), 600);
}
function saveTitle(v) { api('title', v).then(d => { setD(d); toast('✏️ เปลี่ยนชื่องานแล้ว'); }).catch(e => toast('⚠️ ' + e.message)); }
function resetAll(btn) {
  if (!btn._arm) { btn._arm = 1; btn.textContent = '⚠️ แตะอีกครั้งเพื่อยืนยัน'; setTimeout(() => { btn._arm = 0; btn.textContent = '🔄 เริ่มงานใหม่ (ทุกสาขา = ยังไม่ส่ง)'; }, 3000); return; }
  btn._arm = 0; btn.textContent = 'กำลังรีเซ็ต…';
  api('reset').then(d => { setD(d); btn.textContent = '🔄 เริ่มงานใหม่ (ทุกสาขา = ยังไม่ส่ง)'; toast('🔄 เริ่มงานใหม่แล้ว'); }).catch(e => toast('⚠️ ' + e.message));
}
async function clip(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch (e) { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast(msg); } catch (x) { toast('คัดลอกไม่ได้'); } a.remove(); } }
function copyLine() {
  if (!D) return; const T = D.tasks, ok = T.filter(t => t.k === 'ok'), no = T.filter(t => t.k !== 'ok');
  const d = new Date(), TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const L = ['📋 ' + (D.title || 'งาน'), '📅 ' + d.getDate() + ' ' + TH[d.getMonth()] + ' ' + (d.getFullYear() + 543), '✅ ส่งแล้ว ' + ok.length + '/' + T.length + ' สาขา'];
  if (no.length) { L.push('', '❎ ยังไม่ส่ง (' + no.length + ')'); no.forEach(t => L.push('• ' + t.id + ' ' + t.name)); } else L.push('', 'ครบทุกสาขาแล้ว ขอบคุณทุกคนครับ 🙏');
  clip(L.join('\n'), '📋 คัดลอกแล้ว — วางในไลน์ได้เลย');
}
function copyRep() { if (D && D.reportKey) clip(new URL('asm-report.html?k=' + encodeURIComponent(D.reportKey), location.href).href, '🔗 คัดลอกลิงก์ Report แล้ว — ส่งหัวหน้าได้เลย'); }
function tab(t) {
  $('tb-s').classList.toggle('on', t === 's'); $('tb-c').classList.toggle('on', t === 'c');
  $('v-s').style.display = t === 's' ? '' : 'none'; $('v-c').style.display = t === 'c' ? '' : 'none';
  if (t === 'c') ZK.render(); vib(6);
}

// =========================================================
// 🚀 ZK เช็คงานจากชีต — วางข้อมูลดิบ → เลือกคอลัมน์สาขา / กรอง ASM / คอลัมน์ที่ต้องกรอก → ตรวจสอบ → บันทึก
//   • คอลัมน์สาขา = หาเลขสาขาเฉพาะคอลัมน์นั้น (กันเลขสาขาปลายทางในงาน Rotate มานับผิด) · "ทั้งแถว" = แบบเมนู 🚀 เดิม
//   • กรอง ASM = นับเฉพาะแถวของโซนเรา
//   • นับว่าส่ง: "อย่างน้อย 1 แถว" หรือ "ครบทุกแถว" (เช่น Rotate สาขาเรามี 6-7 แถว ต้องกรอกเลขส่งออกครบ)
//   • ไม่เจอสาขาในข้อมูล = ยังไม่ส่ง · ข้อมูลดิบอยู่ในเครื่องนี้ ส่งขึ้นระบบแค่ผลรายสาขา
// =========================================================
var ZK = (function () {
  var O = null, EL = null, S = { rows: [], col: -1, bc: -1, ac: -1, av: '', mode: 'any', at: 0, open: 0 }, RES = null;
  function e(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function vib(n) { try { navigator.vibrate && navigator.vibrate(n); } catch (x) {} }
  // 💾 เก็บในเครื่อง: ตัวเลือกอยู่ใน localStorage · ข้อมูลตาราง (ใหญ่ได้หลักร้อย MB) อยู่ใน IndexedDB
  var DBP = null, SAVE_T = null, SAVED_ROWS = null;
  function db() {
    if (DBP) return DBP;
    DBP = new Promise(function (ok, no) {
      try { var q = indexedDB.open('zk_sheet', 1); q.onupgradeneeded = function () { q.result.createObjectStore('rows'); }; q.onsuccess = function () { ok(q.result); }; q.onerror = function () { no(q.error); }; } catch (x) { no(x); }
    });
    return DBP;
  }
  function idb(mode, fn) { return db().then(function (d) { return new Promise(function (ok, no) { var t = d.transaction('rows', mode), st = t.objectStore('rows'), r = fn(st); t.oncomplete = function () { ok(r && r.result); }; t.onerror = function () { no(t.error); }; }); }); }
  function meta() { var m = {}; Object.keys(S).forEach(function (k) { if (k !== 'rows') m[k] = S[k]; }); m.n = S.rows.length; return m; }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(O.key)); if (s) { var rows = s.rows; delete s.rows; S = Object.assign(S, s); if (rows && rows.length) S.rows = rows; } } catch (x) {}
    if (S.rows.length) return;   // ข้อมูลเก่าแบบ localStorage
    idb('readonly', function (st) { return st.get(O.key); }).then(function (rows) { if (rows && rows.length && !S.rows.length) { S.rows = rows; SAVED_ROWS = rows; render(); } }).catch(function () {});
  }
  function save() {
    try { localStorage.setItem(O.key, JSON.stringify(meta())); } catch (x) {}
    if (SAVED_ROWS === S.rows && !S._dirty) return;
    clearTimeout(SAVE_T);
    SAVE_T = setTimeout(function () {
      var rows = S.rows; S._dirty = 0;
      idb('readwrite', function (st) { return rows.length ? st.put(rows, O.key) : st.delete(O.key); }).then(function () { SAVED_ROWS = rows; })
        .catch(function () { O.toast('เครื่องจำข้อมูลไม่ได้ (ยังใช้ได้จนปิดหน้า)'); });
    }, 300);
  }
  function parse(txt) {
    var rows = [], row = [], cell = '', q = false, sep = txt.indexOf('\t') >= 0 ? '\t' : ',';
    for (var i = 0; i < txt.length; i++) {
      var c = txt[i];
      if (q) { if (c === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"' && cell === '') q = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    var w = 0; rows.forEach(function (r) { w = Math.max(w, r.length); });
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); })
      .map(function (r) { while (r.length < w) r.push(''); return r.map(function (x) { return String(x).trim(); }); });
  }

  function setCell(r, c, v) { while (S.rows.length <= r) S.rows.push([]); var w = Math.max(c + 1, (S.rows[0] || []).length); S.rows.forEach(function (x) { while (x.length < w) x.push(''); }); S.rows[r][c] = v; S._dirty = 1; RES = null; save(); render(); }
  var HOLD = null;
  function colClick(c) {
    if (HOLD === 'skip') { HOLD = null; return; }
    if (!S.rows.length) return O.toast('วางข้อมูลก่อน');
    S.col = S.col === c ? -1 : c; RES = null; save(); render(); vib(8);
  }
  function renderRes() {
    var el = EL.querySelector('#zkRes'), meta = EL.querySelector('#zkResMeta');
    if (!RES) { meta.textContent = ''; el.innerHTML = '<div class="zk-empty">' + (S.rows.length ? (S.col < 0 ? 'คลิกตัวอักษรคอลัมน์ที่ต้องเช็ค แล้วกด 🚀' : 'กด 🚀 ตรวจสอบงาน แล้วผลจะขึ้นตรงนี้') : 'วางข้อมูลก่อน') + '</div>'; return; }
    var c = { ok: 0, no: 0 }; RES.forEach(function (x) { c[x.k]++; });
    meta.textContent = 'ช่อง ' + colName(S.col) + ' · ' + (S.mode === 'all' ? 'ต้องครบทุกแถว' : 'อย่างน้อย 1 แถว');
    el.innerHTML = '<div class="zk-k"><div class="ok"><small>ส่งแล้ว</small><b>' + c.ok + '</b></div><div class="no"><small>ยังไม่ส่ง</small><b>' + c.no + '</b></div></div>' +
      RES.slice().sort(function (a, b) { return (a.k === 'ok') - (b.k === 'ok') || (b.t - b.f) - (a.t - a.f); }).map(function (x, i) {
        return '<div class="zk-r" style="animation-delay:' + Math.min(i * 30, 360) + 'ms"><span class="id">' + e(x.id) + '</span><span class="nm">' + e(x.name) + '<small>' + e(x.d) + '</small></span><span class="zk-st ' + x.k + '">' + (x.k === 'ok' ? '✅ ส่งแล้ว' : '❎ ยังไม่ส่ง') + '</span>' +
          (S.mode === 'all' && x.t ? '<div class="pb"><i style="width:' + Math.round(100 * x.f / x.t) + '%;' + (x.f < x.t ? 'background:#F59E0B' : '') + '"></i></div>' : '') + '</div>';
      }).join('') +
      '<div class="zk-bar"><button class="zk-btn save" id="zkSave" onclick="ZK.apply()">💾 บันทึกสถานะ</button></div><div class="zk-meta">บันทึกแล้ว หน้าสถานะสาขา และลิงก์ Report ของหัวหน้าจะเปลี่ยนตามนี้</div>';
  }
  return {
    mount: function (el, o) { EL = el; O = o; load(); render(); },
    render: function () { if (EL && !RES) render(); },
    set: set, check: check, apply: apply, clear: clear,
    _open: pick, _head: headMenu, _pick: doPick, _close: closePop, _col: colClick, _undo: undoCut, _st: function (k, v) { S[k] = v ? 1 : 0; save(); },
    _state: function () { return S; }, _res: function () { return RES; }, _paste: paste
  };
})();

  key: 'asm_work_sheet_v2', toast: toast,

function aboutDone() { try { localStorage.setItem('about_seen_v1', '1'); } catch (e) {} closeSh(); if (window.afterAbout) { const f = window.afterAbout; window.afterAbout = null; f(); } }
