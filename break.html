    /* แผ่นล่าง */

    .tgl small { display: block; font-weight: 600; font-size: 11.5px; color: #8E8E93; }

    .pill { display: flex; background: #F2F2F7; border-radius: 12px; padding: 3px; gap: 2px; } .pill button { border-radius: 9px; padding: 7px 12px; background: none; font-weight: 700; font-size: 12.5px; color: #6E6E73; } .pill button.on { background: var(--d); color: var(--y); }

    .b-no { background: #E9E9EE; } .b-yes { flex: 1.7 !important; background: linear-gradient(180deg, #FFE033, #FFD600); box-shadow: 0 10px 22px -12px rgba(242,194,0,1); } .b-red { flex: 1.7 !important; background: #FFE5E3; color: #D70015; } .b-g { flex: 1.7 !important; background: var(--ok); color: #fff; }
    .msg { font-size: 14.5px; font-weight: 600; line-height: 1.6; color: #3A3A3C; background: #fff; border-radius: 18px; padding: 14px; }
    .msg b { font-family: 'Kanit', sans-serif; }

    /* ประวัติ */
    .rnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; } .rnav button { border-radius: 100px; padding: 10px 15px; background: rgba(255,255,255,.7); font-weight: 800; font-size: 13px; } .rnav button.on { background: var(--d); color: var(--y); }
    table.lg { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
    table.lg th { font: 700 11px 'Kanit', sans-serif; color: #6E6E73; text-align: center; padding: 0 6px; } table.lg th:first-child { text-align: left; }
    table.lg td { background: #FFFDF5; padding: 10px 8px; text-align: center; font-weight: 700; } table.lg td:first-child { text-align: left; border-radius: 14px 0 0 14px; font-family: 'Kanit', sans-serif; } table.lg td:last-child { border-radius: 0 14px 14px 0; }
    table.lg td.r { color: #D70015; }
    .toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0; z-index: 400; background: var(--d); color: var(--y); font-weight: 700; font-size: 13.5px; padding: 11px 18px; border-radius: 100px; box-shadow: 0 12px 26px -10px rgba(0,0,0,.6); transition: all .45s var(--spring); pointer-events: none; max-width: 92vw; text-align: center; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); } .toast.err { background: #D70015; color: #fff; }

      <div class="sub" id="sub">กดออกพัก <b>ตอนก้าวออกจากหน้าร้าน</b> · กลับก่อนเวลา = เวลาที่เหลือตัดทิ้ง ไม่ทบ</div>

  <div class="sheet lv2" id="cfS"><div class="bd" onclick="closeS('cfS')"></div><div class="box" id="cfBox"></div></div>
  <div class="sheet" id="setS"><div class="bd" onclick="closeS('setS')"></div><div class="box" id="setBox"></div></div>
  <div class="toast" id="toast"></div>

  <script>
    const pad = n => String(n).padStart(2, '0');
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hm = t => t ? `${pad(new Date(t).getHours())}:${pad(new Date(t).getMinutes())}` : '';
    const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const dmy = iso => { const d = new Date(iso + 'T00:00:00'); return `${d.getDate()} ${TH_MS[d.getMonth()]}`; };
    const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    if (window.parent === window) document.getElementById('homeb').style.display = 'flex';
    const run = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
    let B = null, SKEW = 0, VIEW = 'today', LOGR = 'today', SETP = null;
    const now = () => Date.now() + SKEW;
    function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {} }
    function toast(m, err) { const t = document.getElementById('toast'); t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), err ? 4200 : 2200); }
    function openS(id) { document.getElementById(id).classList.add('open'); vib(6); }
    function closeS(id) { document.getElementById(id).classList.remove('open'); }
    function glide() { const on = document.querySelector('#tabSeg button.on'), g = document.getElementById('glider'); if (on) { g.style.width = on.offsetWidth + 'px'; g.style.transform = `translateX(${on.offsetLeft - 5}px)`; } }
    window.addEventListener('resize', glide); if (document.fonts) document.fonts.ready.then(glide);
    function setView(v) { VIEW = v; vib(6); ['today', 'log'].forEach(k => { document.getElementById('t-' + k).classList.toggle('on', k === v); document.getElementById('view-' + k).style.display = k === v ? 'block' : 'none'; }); glide(); if (v === 'log') loadLog(); }
    const mmss = ms => { const s = Math.max(0, Math.round(Math.abs(ms) / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
    const ini = n => String(n || '?').trim().slice(0, 1);

    // ===================== โหลด =====================
    function load(quiet) {
      run('getBoard').then(b => { B = b; SKEW = (b.now || Date.now()) - Date.now(); render(); })
        .catch(e => { if (!quiet) document.getElementById('meCard').innerHTML = `<div class="empty" style="color:#AEAEB2">โหลดไม่สำเร็จ: ${esc(e.message)}${/ไม่พบคำสั่ง|ยังไม่ได้ใส่/.test(e.message) ? '<br>— วาง Break.gs + API.gs แล้ว Deploy เป็น New version' : ''}</div>`; });
    }
    load();
    setInterval(() => { if (!document.hidden) load(true); }, 20000);

    function poolCount(role) { const sep = B.cfg.pcSeparate, pool = sep && role === 'PC' ? 'PC' : 'ALL'; return B.list.filter(x => x.status === 'on' && (sep ? (x.role === 'PC' ? 'PC' : 'ALL') === pool : true)).length; }
    function myTurn(p) {
      if (p.status !== 'none') return false;
      const free = B.cfg.max - poolCount(p.role); if (free <= 0) return false;
      const sep = B.cfg.pcSeparate, pool = r => sep && r === 'PC' ? 'PC' : 'ALL';
      const ordered = B.queue.filter(id => { const x = B.list.find(y => y.id === id); return x && x.status === 'none' && pool(x.role) === pool(p.role); });
      const pos = ordered.indexOf(p.id);

          <span class="v"><b class="cd">--:--</b><small class="cdl">เหลือ</small></span>${(B.me.mgr || p.id.startsWith('M:')) && p.id !== B.me.id ? `<button class="mini" onclick="askFinish('${esc(p.id)}')">กลับแล้ว</button>` : ''}</div>`).join('') : '<div class="empty">ยังไม่มีใครพัก — หน้าร้านครบ 💪</div>');

    function tick() {
      if (!B) return;

        const el = now() - me.buy, ring = document.getElementById('myRing');

          document.getElementById('myBar').style.strokeDashoffset = 326.7 * (1 - Math.min(1, el / (me.buyDue - me.buy))); }

      if (me && me.status === 'on') {
        const left = me.due - now(), total = B.cfg.mins * 60000, ring = document.getElementById('myRing');

    // ===================== 📊 ประวัติ =====================

    function loadLog() {
      const d = new Date(), t = isoOf(d);
      const [f, to] = LOGR === 'today' ? [t, t] : LOGR === '7' ? [isoOf(new Date(Date.now() - 6 * 864e5)), t] : LOGR === 'month' ? [t.slice(0, 8) + '01', t] : [isoOf(new Date(d.getFullYear(), d.getMonth() - 1, 1)), isoOf(new Date(d.getFullYear(), d.getMonth(), 0))];
      document.getElementById('logBody').innerHTML = '<div class="loading">กำลังโหลด…</div>';
      run('log', f, to).then(r => {
        const by = {};
        r.list.forEach(x => { if (!x.end) return; const o = by[x.id] = by[x.id] || { name: x.name, n: 0, used: 0, over: 0, overN: 0, buyN: 0, buy: 0 }; o.n++; o.used += x.used || 0; if (x.buy) { o.buyN++; o.buy += x.buyMins || 0; } if (x.over) { o.overN++; o.over += x.over; } });
        const ks = Object.keys(by).sort((a, b) => by[b].overN - by[a].overN || by[a].name.localeCompare(by[b].name, 'th'));
        const mgr = B && B.me.mgr;
        document.getElementById('logBody').innerHTML = `<div class="lc"><div class="ch"><b>${mgr ? '👥 สรุปรายคน' : '🙋 ของฉัน'}</b><small>${dmy(r.from)}${r.from !== r.to ? ' – ' + dmy(r.to) : ''} · พัก ${r.mins} นาที</small></div>
          ${ks.length ? `<table class="lg"><tr><th>ชื่อ</th><th>พัก (วัน)</th><th>เฉลี่ย (นาที)</th><th>เกินเวลา</th><th>เกินรวม</th><th>ซื้อข้าวเฉลี่ย</th></tr>${ks.map(k => { const o = by[k]; return `<tr><td>${esc(o.name)}</td><td>${o.n}</td><td>${o.n ? Math.round(o.used / o.n) : '-'}</td><td class="${o.overN ? 'r' : ''}">${o.overN ? o.overN + ' ครั้ง' : '—'}</td><td class="${o.over ? 'r' : ''}">${o.over ? o.over + ' น.' : '—'}</td><td>${o.buyN ? Math.round(o.buy / o.buyN) + ' น. (' + o.buyN + ')' : '—'}</td></tr>`; }).join('')}</table>` : '<div class="empty">ไม่มีข้อมูล</div>'}</div>
          <div class="lc"><div class="ch"><b>🕒 รายการ</b><small>${r.list.length} รายการ</small></div>${r.list.slice().reverse().map(x => `<div class="pr"><span class="av">${esc(ini(x.name))}</span><span class="t"><b>${esc(x.name)}${x.over ? `<span class="tg">เกิน ${x.over} น.</span>` : ''}${x.buy ? `<span class="tg or">🛍️ ${x.buyMins || 0} น.</span>` : ''}</b><small>${dmy(x.date)} · ${x.buy ? '🛍️ ' + hm(x.buy) + ' · ' : ''}${hm(x.start)}–${x.end ? hm(x.end) : 'ยังไม่กลับ'}${x.by && x.by !== x.name ? ' · กดโดย ' + esc(x.by) : ''}</small></span><span class="v"><b>${x.end ? x.used : '…'}</b><small>นาที</small></span></div>`).join('') || '<div class="empty">ไม่มีข้อมูล</div>'}</div>`;
      }).catch(e => document.getElementById('logBody').innerHTML = `<div class="lc"><div class="empty">${esc(e.message)}</div></div>`);
    }

    // ===================== ⚙️ ตั้งค่า (ผู้จัดการ) =====================
    function openSet() {
      const c = B.cfg, pp = B.people || { accounts: [], manual: [] };
      SETP = { hidden: {}, manual: pp.manual.map(m => Object.assign({}, m)), pc: !!c.pcSeparate, cb: !!c.countBuy };
      pp.accounts.forEach(a => { if (a.hidden) SETP.hidden[a.id] = 1; });
      paintSet(c, pp); openS('setS');
    }
    function paintSet(c, pp) {
      pp = pp || B.people;
      const g = id => document.getElementById(id);
      c = c || (g('sMins') ? { mins: g('sMins').value, max: g('sMax').value, grace: g('sGrace').value, buyMax: g('sBuy').value } : B.cfg);   // พิมพ์ค้างไว้ไม่หาย
      document.getElementById('setBox').innerHTML = `<div class="grab"></div><div class="shd"><span class="ic">⚙️</span><div><h3>ตั้งค่าพักทานข้าว</h3><small>เฉพาะผู้จัดการ</small></div><button class="x" onclick="closeS('setS')">✕</button></div>
        <div class="three"><div><div class="lab"><span>พักกี่นาที</span></div><input class="inp" id="sMins" type="number" value="${c.mins}"></div><div><div class="lab"><span>พร้อมกันได้</span></div><input class="inp" id="sMax" type="number" value="${c.max}"></div><div><div class="lab"><span>ผ่อนผัน (นาที)</span></div><input class="inp" id="sGrace" type="number" value="${c.grace}"></div></div>
        <div class="lab"><span></span><small>เกินเวลา + ผ่อนผันแล้ว = แจ้งผู้จัดการ</small></div>
        <div class="lab"><span>🛍️ ซื้อข้าวเกินกี่นาทีเตือน</span></div><input class="inp" id="sBuy" type="number" value="${c.buyMax || 15}">
        <div class="tgl" style="margin-top:8px" onclick="SETP.cb=!SETP.cb;this.querySelector('.sw').classList.toggle('on',SETP.cb)"><span>นับเวลาซื้อข้าวรวมในเวลาพัก<small>ปิด = เวลาพักเริ่มนับตอนกด "เริ่มทานข้าว" (เวลาซื้อข้าวจดแยกไว้ใน Log)</small></span><span class="sw ${SETP.cb ? 'on' : ''}"></span></div>
        <div class="tgl" onclick="SETP.pc=!SETP.pc;this.querySelector('.sw').classList.toggle('on',SETP.pc)"><span>PC นับโควตาแยกจากพนักงานร้าน<small>ปิด = PC กับพนักงานรวมกันไม่เกิน ${c.max} คน</small></span><span class="sw ${SETP.pc ? 'on' : ''}"></span></div>
        <div class="lab"><span>👥 บัญชีในระบบ</span><small>ปิด = ไม่อยู่ในรายชื่อพัก (เช่น ลาออก / ย้ายสาขา)</small></div>
        ${pp.accounts.map(a => `<div class="tgl" onclick="tgHide('${esc(a.id)}',this)"><span>${esc(a.name)}<small>${a.role === 'PC' ? 'PC ' + esc(a.brand) : a.role === 'MANAGER' ? 'ผู้จัดการ' : 'พนักงาน'} · User ${esc(a.id)}</small></span><span class="sw ${SETP.hidden[a.id] ? '' : 'on'}"></span></div>`).join('')}
        <div class="lab"><span>➕ คนที่ยังไม่มีบัญชี</span><small>น้องใหม่ / PC ใหม่ · ใครก็กดพักแทนได้</small></div>
        <div id="manL">${SETP.manual.map((m, i) => `<div class="tgl"><span>${esc(m.name)}<small>${m.role === 'PC' ? 'PC' : 'พนักงาน'}</small></span><button class="rmb" onclick="SETP.manual.splice(${i},1);paintSet()">✕</button></div>`).join('')}</div>
        <div style="display:flex;gap:6px;align-items:center"><input class="inp" id="nName" placeholder="ชื่อเล่น" maxlength="30" style="flex:1"><div class="pill" id="nRole"><button class="on" data-v="STAFF">พนักงาน</button><button data-v="PC">PC</button></div><button class="rb" style="height:48px;width:48px;border-radius:16px" onclick="addMan()">＋</button></div>
        <div class="msg" style="margin-top:10px;font-size:12.5px">💡 พอน้องใหม่สมัครบัญชีแล้ว จะขึ้นในรายการบัญชีเอง แล้วลบชื่อที่เพิ่มเองออกได้</div>
        <div class="sfoot"><button class="b-no" onclick="closeS('setS')">ปิด</button><button class="b-yes" onclick="saveSet(this)">💾 บันทึก</button></div>`;
      document.getElementById('nRole').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#nRole button').forEach(x => x.classList.toggle('on', x === b)); };
    }
    function tgHide(id, el) { if (SETP.hidden[id]) delete SETP.hidden[id]; else SETP.hidden[id] = 1; el.querySelector('.sw').classList.toggle('on', !SETP.hidden[id]); vib(5); }
    function addMan() { const n = document.getElementById('nName').value.trim(); if (!n) return toast('ใส่ชื่อก่อน', 1); SETP.manual.push({ name: n, role: document.querySelector('#nRole button.on').dataset.v }); paintSet(); }
    async function saveSet(btn) {
      btn.disabled = true;
      try {
        await run('saveCfg', { mins: +document.getElementById('sMins').value, max: +document.getElementById('sMax').value, grace: +document.getElementById('sGrace').value, pcSeparate: SETP.pc, buyMax: +document.getElementById('sBuy').value, countBuy: SETP.cb });
        B = await run('savePeople', { hidden: SETP.hidden, manual: SETP.manual }); render(); closeS('setS'); toast('💾 บันทึกแล้ว');
      } catch (e) { btn.disabled = false; toast(e.message, 1); }
    }
  </script>
</body>
</html>
