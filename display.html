:root{ --y:#FFD600; --d:#1C1C1E; --d2:#2C2C2E; --g:#8E8E93; --ok:#16A34A; --no:#E5484D;
  --ios-ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;overflow-x:hidden}
body{min-height:100vh;color:var(--d);font-family:'IBM Plex Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 55% at 50% -12%,#FFF3A6 0%,rgba(255,243,166,0) 60%),var(--y);background-attachment:fixed;

button{font-family:inherit;cursor:pointer;color:inherit;border:0;background:none;padding:0}
button:focus{outline:none}
.num{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto}
.navrow{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:40;display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
[data-sys-back-slot]{display:flex}[data-sys-back-slot]:empty{display:none}
.titlebar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;
  background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 28px -10px rgba(60,48,0,.35)}
.titlebar h1{margin:0;font-size:16px;font-weight:700;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.titlebar h1 small{display:block;font-size:11px;color:#6E6E73;font-weight:600}
.ring{position:relative;width:44px;height:44px;flex-shrink:0}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)} .ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px 'Space Grotesk',sans-serif}
.tb-btn{border-radius:12px;padding:9px 11px;font-weight:700;font-size:13px;background:var(--d);color:var(--y)}

.hero{background:var(--d);color:#fff;border-radius:24px;padding:14px 16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero div{background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px}
.hero small{display:block;font-size:10.5px;color:#AEAEB2;font-weight:700}
.hero b{font:700 20px 'Space Grotesk',sans-serif}
.hero .cv{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .cv b{font:700 14px 'IBM Plex Sans Thai',sans-serif;color:var(--y)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border-radius:100px;padding:8px 13px;background:rgba(255,255,255,.75);font-weight:700;font-size:13px;transition:transform .3s var(--spring)}
.chips button.on{background:var(--d);color:var(--y)} .chips button i{font-style:normal;opacity:.6;margin-left:4px}
.chips button:active{transform:scale(.92)}

.list{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:#FFFDF5;border-radius:22px;padding:12px;box-shadow:0 6px 20px -14px rgba(60,48,0,.5);animation:rise .45s var(--ios-ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card.none{opacity:.55}
.ch{display:flex;align-items:center;gap:8px}
.ch .no{font:700 11px 'Space Grotesk',sans-serif;background:var(--d);color:var(--y);border-radius:8px;padding:3px 7px;flex-shrink:0}
.ch b{flex:1;min-width:0;font-size:14.5px;line-height:1.3}
.ch .st{font-size:11px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap}
.st.ok{background:#E3F9E9;color:#1E7B34}.st.part{background:#FFF1D6;color:#8A5300}.st.todo{background:#F2F2F7;color:#6E6E73}.st.bad{background:#FFE5E5;color:#C11A1F}.st.na{background:#EEE;color:#888}
.hint{font-size:11.5px;color:#8E8E93;font-weight:600;margin:5px 0 8px;line-height:1.45}
.slots{display:grid;gap:8px}
.slot{background:#F2F2F7;border-radius:16px;padding:8px;position:relative}
.slot.bad{box-shadow:inset 0 0 0 2px var(--no)} .slot.ok{box-shadow:inset 0 0 0 2px #34C759}
.sl-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:6px;gap:6px}
.sl-h small{color:#8E8E93;font-weight:700}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.ph .im{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#DDD center/cover no-repeat;cursor:pointer}
.ph .im img{width:100%;height:100%;object-fit:cover;display:block}
.ph .im .by{position:absolute;left:4px;bottom:4px;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px}
.ph .im.up::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.55) linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent) 0 0/200% 100%;animation:shim 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.add{display:flex;gap:6px;margin-top:6px}
.add button{flex:1;height:40px;border-radius:12px;font-weight:700;font-size:13px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .3s var(--spring)}
.add button:active{transform:scale(.94)} .add .cam{background:var(--d);color:var(--y)}
.rv{display:flex;gap:6px;margin-top:6px}
.rv button{flex:1;height:34px;border-radius:10px;font-weight:800;font-size:12.5px;background:#fff}
.rv .ok.on{background:#34C759;color:#fff} .rv .bad.on{background:var(--no);color:#fff}
.note{font-size:12px;font-weight:700;color:#C11A1F;background:#FFE5E5;border-radius:10px;padding:6px 9px;margin-top:6px}
.memo{margin-top:8px}
.memo textarea{width:100%;min-height:40px;resize:vertical;border:0;border-radius:12px;background:#FFF6C9;padding:9px 11px;font:600 13px/1.45 'IBM Plex Sans Thai',sans-serif;color:var(--d)}

.nonebtn{margin-top:8px;font-size:12px;font-weight:700;color:#6E6E73;text-decoration:underline}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,214,0,0),rgba(255,214,0,.95) 35%)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar button{flex:1;height:54px;border-radius:18px;font-weight:800;font-size:15px;background:var(--d);color:var(--y);box-shadow:0 10px 24px -10px rgba(0,0,0,.6);transition:transform .3s var(--spring)}
.bar button:active{transform:scale(.95)} .bar button small{display:block;font-size:11px;font-weight:600;color:#AEAEB2}
.bar .g{flex:0 0 auto;width:54px;background:#fff;color:var(--d);font-size:20px}

.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;padding:10px}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#F2F2F7;border-radius:26px;padding:16px;animation:rise .35s var(--ios-ease) both}
.sheet h3{margin:0 0 4px;font-size:17px} .sheet p{margin:0 0 12px;font-size:12.5px;color:#6E6E73;font-weight:600;line-height:1.5}

#viewer img{max-width:100%;max-height:78vh;border-radius:12px}
#viewer .vb{display:flex;gap:8px;margin-top:12px}
#viewer .vb button{height:46px;padding:0 18px;border-radius:15px;font-weight:700;background:#2C2C2E;color:#fff}
#viewer .vb .rd{background:var(--no)}
#viewer small{color:#AEAEB2;font-weight:600;margin-top:8px}

#toast{opacity:0;transition:transform .45s var(--spring),opacity .25s}#toast.on{transform:translate(-50%,0);opacity:1}

.about h3{font-size:19px!important;margin:4px 0 2px!important}.about .by{display:inline-block;background:var(--d);color:var(--y);border-radius:100px;padding:6px 14px;font-weight:700;font-size:13px;margin:6px 0 12px}

.credit .ic{font-size:26px;animation:abBob 2.4s ease-in-out infinite}.credit .tx{flex:1;min-width:0}
.credit b{display:block;font-size:15px;color:#FFD600;letter-spacing:.2px}.credit small{display:block;font-size:11px;color:#D1D1D6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.foot-cr{text-align:center;font-size:11.5px;font-weight:700;color:rgba(28,28,30,.55);margin:18px 0 6px}
.about .cp{font-size:11px;color:#8E8E93;font-weight:600;margin-top:10px}

}

const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// จัดรูป n รูปให้พอดีกรอบ (ไม่ตัดรูป) → เลือกจำนวนคอลัมน์ที่ทำให้รูปใหญ่สุด
function layout(box, imgs) {
  const [X, Y, W, H] = box, pad = 45720, g = 64008, n = imgs.length; let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), cw = (W - 2 * pad - (c - 1) * g) / c, chh = (H - 2 * pad - (r - 1) * g) / r;
    const areas = imgs.map(p => { const a = (p.w || 4) / (p.h || 3), w = Math.min(cw, chh * a); return w * (w / a); });
    const sc = Math.min(...areas); if (!best || sc > best.sc) best = { c, r, cw, chh, sc };
  }
  return imgs.map((p, i) => {
    const row = Math.floor(i / best.c), inRow = Math.min(best.c, n - row * best.c), col = i % best.c;
    const a = (p.w || 4) / (p.h || 3), w = Math.min(best.cw, best.chh * a), h = w / a;
    const rowW = inRow * best.cw + (inRow - 1) * g, x0 = X + (W - rowW) / 2, gridH = best.r * best.chh + (best.r - 1) * g, y0 = Y + (H - gridH) / 2;
    return { x: Math.round(x0 + col * (best.cw + g) + (best.cw - w) / 2), y: Math.round(y0 + row * (best.chh + g) + (best.chh - h) / 2), w: Math.round(w), h: Math.round(h) };
  });
}

      if (note && note.t && i > 0) {   // 📝 หมายเหตุ = กล่องข้อความช่องว่างด้านล่างสไลด์
        const bot = Math.max(...boxes.map(b => b[1] + b[3] + (b[4] ? 470000 : 0)), 6100000) + 40000, top = Math.min(bot, 6858000 - 420000);
        add += `<p:sp><p:nvSpPr><p:cNvPr id="${++pid}" name="หมายเหตุ"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${Math.min(...boxes.map(b => b[0]))}" y="${top}"/><a:ext cx="${Math.max(...boxes.map(b => b[0] + b[2])) - Math.min(...boxes.map(b => b[0]))}" cy="${6858000 - top - 30000}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="t"><a:normAutofit/></a:bodyPr><a:lstStyle/><a:p><a:r><a:rPr lang="th-TH" sz="1400" b="1"><a:solidFill><a:srgbClr val="C00000"/></a:solidFill></a:rPr><a:t>หมายเหตุ: ${xmlEsc(note.t)}</a:t></a:r></a:p></p:txBody></p:sp>`;
      }
      if (add) { xml = xml.replace('</p:spTree>', add + '</p:spTree>'); zip.file(part, xml); zip.file(relP, rel); }
      else if (i === 0) zip.file(part, xml);
    }
    progSet('บีบไฟล์…', 94);
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', compression: 'DEFLATE', compressionOptions: { level: 3 } });
    const bid = String(ST.cfg.id || ((ST.cfg.cover || '').match(/ID\s*(\d+)/i) || [])[1] || '1326').replace(/\D/g, '') || '1326';
    const fname = bid + '.pptx';   // บริษัทกำหนด: ชื่อไฟล์ = เลข ID สาขาอย่างเดียว เช่น 1326.pptx
    run('markExport').then(r => { ST = r; UPD = String(r.round.upd || ''); render(); ping(false); }).catch(() => {});
    const file = new File([blob], fname, { type: blob.type }), mb = (blob.size / 1048576).toFixed(1);
    sheet(`<h3>✅ สร้างไฟล์เสร็จแล้ว</h3><p>${esc(fname)} · ${mb} MB · ${all.length} รูป</p>
      <div class="ft"><button onclick="dl()">⬇️ บันทึกไฟล์</button>${navigator.canShare && navigator.canShare({ files: [file] }) ? '<button class="ok" onclick="shareF()">📤 แชร์ / ส่งไลน์</button>' : ''}</div>
      ${GO ? '<div class="ft"><button class="ok" style="background:#16A34A;color:#fff" onclick="sentDone()">✅ ส่งบริษัทแล้ว (แจ้งคนตามงาน)</button></div>' : ''}
      <div class="ft"><button onclick="closeSh()">ปิด</button></div>`);
    window.sentDone = () => run('markSent').then(r => { ST = r; render(); ping(true); closeSh(); toast('✅ แจ้งว่าส่งแล้ว ขอบคุณครับ'); });
    window.dl = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); };
    window.shareF = () => navigator.share({ files: [file], title: fname }).catch(() => {});
  } catch (e) { sheet(`<h3>⚠️ สร้างไฟล์ไม่สำเร็จ</h3><p>${esc(e.message)}</p><div class="ft"><button onclick="closeSh()">ปิด</button></div>`); }
}

if (GO) { document.querySelectorAll('.bar .g').forEach(b => b.style.display = 'none'); }
load(true);
setTimeout(() => aboutFirst(GO ? () => { if (ST && !ST.cfg.id) goSetup(true); } : null), 300);   // เปิดครั้งแรก โชว์ About ก่อน
</script>
</body>
</html>
