  </div>
  <div class="wrap" id="app"><div class="loading">กำลังโหลด Action Plan…</div></div>

  <div class="sheet" id="sh1"><div class="bd" onclick="closeS('sh1')"></div><div class="box" id="sh1b"></div></div>
  <div class="sheet lv2" id="sh2"><div class="bd" onclick="closeS('sh2')"></div><div class="box" id="sh2b"></div></div>
  <div class="toast" id="toast"></div>

<script>
  // ================= พื้นฐาน =================
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const TH_MS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const dmy = iso => { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return `${d.getDate()} ${TH_MS[d.getMonth()]}`; };
  const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const tfmt = t => { const d = new Date(t); return `${d.getDate()} ${TH_MS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const f1 = v => v == null || isNaN(v) ? '–' : (Math.round(v * 10) / 10).toLocaleString('th-TH');
  const f0 = v => v == null || isNaN(v) ? '–' : Math.round(v).toLocaleString('th-TH');
  const kb = v => v == null ? '–' : Math.abs(v) >= 1000 ? (Math.round(v / 100) / 10).toLocaleString('th-TH') + 'k' : f0(v);
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {} };
  const run = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
  function toast(m, err) { const t = $('toast'); t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), err ? 4500 : 2200); }
  function openS(id, html) { if (html != null) $(id + 'b').innerHTML = html; $(id).classList.add('open'); vib(6); }
  function closeS(id) { $(id).classList.remove('open'); if (id === 'sh1' || id === 'sh2') recStop(true); }
  if (window.parent === window) $('homeb').style.display = 'flex';
  const BRAND_COLORS = { APPLE: '#8E8E93', SAMSUNG: '#1E40FF', OPPO: '#16A34A', VIVO: '#38BDF8', XIAOMI: '#FF6900', REALME: '#FFC300', HONOR: '#8B5CF6', INFINIX: '#84CC16', NOTHING: '#A1A1AA', TCL: '#EF4444', ZTE: '#0EA5E9', TECNO: '#F472B6', HUAWEI: '#DC2626', POCO: '#FACC15' };
  const bcol = (b, i) => BRAND_COLORS[b] || ['#64748B', '#D946EF', '#14B8A6', '#F59E0B', '#6366F1'][(i || 0) % 5];
  const attCol = (a, t) => a == null ? '#8E8E93' : !t ? '#64D2FF' : a >= t ? '#30D158' : a >= t * .7 ? '#FFD60A' : '#FF453A';
  const ETA = { done: ['done', '✅ ถึงเป้าแล้ว'], ok: ['ok', '🟢 ทัน'], risk: ['risk', '🟡 เสี่ยง'], late: ['late', '🔴 ไม่ทัน'] };
  const REFS = ['📊 Dashboard งานโฟกัส', '🏆 Ranking แบรนด์', '📈 กราฟรายวัน', '👀 สังเกตหน้าร้าน', '🧑‍💼 ASM แจ้ง', '💬 เสียงลูกค้า'];
  const RES = { good: '✅ ได้ผล', some: '⚠️ ดีขึ้นบ้าง', none: '❌ ยังไม่เห็นผล' };
  let B = null, TAB = '', CUR = null, ED = null, REV = null, PV = null;

  // ================= เริ่ม =================
  async function boot() {
    try { B = await run('boot'); } catch (e) { $('app').innerHTML = `<div class="lc empty">โหลดไม่สำเร็จ: ${esc(e.message)}${/ไม่พบคำสั่ง|ยังไม่ได้ใส่/.test(e.message) ? '<br>— วาง ActionPlan.gs + API.gs ใหม่ แล้ว Deploy เป็น New version' : ''}</div>`; return; }
    const m = B.me;
    $('newBtn').style.display = m.mgr ? '' : 'none';
    $('setBtn').style.display = m.mgr ? '' : 'none';
    const tabs = m.mgr ? [['active', '🔥 กำลังทำ'], ['draft', '📝 ร่าง'], ['closed', '🏁 ปิดแล้ว']] : [['mine', '📋 งานของฉัน'], ['active', '🔥 แผนของร้าน']];
    if (!TAB) TAB = tabs[0][0];
    $('tabSeg').innerHTML = tabs.map(t => `<button class="${t[0] === TAB ? 'on' : ''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
    home();
  }
  function setTab(t) { TAB = t; vib(6); document.querySelectorAll('#tabSeg button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${t}'`))); home(); }
  function hero(title, sub) {
    return `<div class="rise"><span class="eyebrow"><span class="ic">📝</span>ACTION PLAN · 1326</span><h1>${title}</h1><div class="sub">${sub}</div></div>`;
  }

  // ================= หน้าแรก =================
  function home() {
    PV = null; window.scrollTo(0, 0);
    const m = B.me, ps = B.plans || [];
    let h = noData() + hero('Action Plan', `ข้อมูลยอดขายถึง <b>${dmy(B.at) || '–'}</b> · วันที่ ${B.day || '–'}/${B.days || '–'} ของเดือน${B.chokReady ? ' · 🤖 น้องโชคพร้อม' : m.mgr ? ' · ⚠️ ยังไม่ได้ตั้ง API key น้องโชค (⚙️)' : ''}`);
    if (m.mgr) {
      if (TAB === 'active') {
        const fails = (B.items || []).filter(x => x.fail && !ps.some(p => p.status !== 'closed' && p.kind === x.kind && p.item === x.item));
        h += `<div class="dk rise" style="margin-bottom:14px"><div class="ch"><b>💡 ระบบเสนอ: ยังไม่ผ่าน</b><small>${fails.length} งาน · แตะเพื่อสร้างแผน</small></div>
          ${fails.length ? `<div class="sug">${fails.slice(0, 12).map(sugCard).join('')}</div>` : '<div class="empty" style="color:#AEAEB2">ทุกงานผ่าน หรือมีแผนอยู่แล้ว 🎉</div>'}</div>`;
      }
      const L = ps.filter(p => p.status === TAB);
      h += `<div class="ch" style="margin-top:4px"><b>${{ active: '🔥 แผนที่กำลังทำ', draft: '📝 ร่างแผน', closed: '🏁 ปิดแล้ว' }[TAB]}</b><small>${L.length} แผน</small></div>`;
      h += L.length ? `<div class="plans">${L.map(planCard).join('')}</div>` : `<div class="lc empty">${TAB === 'active' ? 'ยังไม่มีแผนที่กำลังทำ — เลือกจาก 💡 ด้านบน หรือกด +' : 'ยังไม่มี'}</div>`;
    } else {
      if (TAB === 'mine') {
        const asks = B.asks || [], mine = ps.filter(p => p.status === 'active').flatMap(p => (p.mine || []).map(a => Object.assign({ plan: p }, a)));
        if (asks.length) h += `<div class="lc rise" style="margin-bottom:12px"><div class="ch"><b>💬 น้องโชคถามหน่อย</b><small>ตอบหรือไม่ตอบก็ได้</small></div>${asks.map(askCard).join('')}</div>`;
        h += `<div class="lc rise"><div class="ch"><b>📋 Action ของฉัน</b><small>${mine.length} ข้อ · เช็กอินวันละครั้ง</small></div><div class="mine">${mine.map(a => `
          <div class="mi"><div class="t"><b>${esc(a.text)}</b><small>${esc(a.plan.title)} · DAY ${a.plan.day}/${a.plan.roundDays}</small></div>
            ${a.practice ? `<button class="btn w sm" onclick="practice('${a.plan.id}','${a.id}','${esc(a.practice.topic || '')}')">🎥 ฝึก</button>` : ''}
            <button class="btn sm ${a.done ? 'y' : ''}" onclick="checkinS('${a.plan.id}','${a.id}')">${a.done ? '✓ ทำแล้ว' : 'เช็กอิน'}</button></div>`).join('') || '<div class="empty">ยังไม่มี Action ที่คุณเป็นเจ้าภาพ</div>'}</div></div>`;
      } else {
        const L = ps.filter(p => p.status === 'active');
        h += L.length ? `<div class="plans">${L.map(planCard).join('')}</div>` : '<div class="lc empty">ยังไม่มีแผนที่กำลังทำ</div>';
      }
    }
    $('app').innerHTML = h;
  }
  function sugCard(x) {
    if (x.kind === 'sales') return `<div class="sg" onclick="newPlan('sales','${esc(x.item)}')" style="cursor:pointer"><div class="t"><b>💰 ${esc(x.item)}</b><span>${f1(x.fcp)}%</span></div>
      <div class="bar"><i style="width:${Math.min(100, x.fcp)}%;background:${attCol(x.fcp, 100)}"></i></div><small>Forecast ${f1(x.fcp)}% · ยอด ${kb(x.v)} / ${kb(x.t)} ฿ · ขาด ${kb(x.gap)} ฿</small></div>`;
    const lack = (x.brands || []).filter(b => b.need).slice(0, 3);
    return `<div class="sg" onclick="newPlan('focus','${esc(x.item)}')" style="cursor:pointer"><div class="t"><b>🎯 ${esc(x.item)}</b><span>${f1(x.att)}%</span></div>
      <div class="bar"><i style="width:${Math.min(100, x.t ? x.att / x.t * 100 : 0)}%;background:${attCol(x.att, x.t)}"></i></div>
      <small>เป้า ${x.t}% · ${x.c}/${x.b} · ขาด <b style="color:#FF6961">${x.need} ชิ้น</b>${lack.length ? '<br>ฉุด: ' + lack.map(b => `${esc(b.brand)} ${b.c}/${b.b}`).join(' · ') : ''}</small></div>`;
  }
  function planCard(p) {
    const e = ETA[p.eta], pr = p.prog;
    const dots = p.status === 'active' ? `<div class="dots">${Array.from({ length: p.roundDays || 7 }, (_, i) => `<i class="${i + 1 < p.day ? 'on' : i + 1 === p.day ? 'now' : ''}"></i>`).join('')}</div>` : '<div style="height:10px"></div>';
    return `<div class="pc rise" onclick="openPlan('${p.id}')"><div class="hd"><div><b>${esc(p.title)}</b><small>${p.kind === 'sales' ? '💰 ยอดขาย' : '🎯 งานโฟกัส'} · ${esc(p.item)}${p.round ? ' · รอบ ' + p.round : ''}</small></div>
      ${p.status === 'closed' ? `<span class="tag">${RES[p.result] || 'ปิดแล้ว'}</span>` : e ? `<span class="tag ${e[0]}">${e[1]}</span>` : p.status === 'draft' ? '<span class="tag">ร่าง</span>' : ''}</div>${dots}
      <div class="ft"><span>${p.status === 'active' ? (p.day ? `DAY <b>${p.day}</b>/${p.roundDays}` : 'รอข้อมูล DAY 1') : 'อัปเดต ' + tfmt(p.updated)}</span>
      ${pr ? `<span>ตอนนี้ <b>${f1(pr.now)}${pr.unit}</b> / เป้า ${f1(pr.goal)}${pr.unit}</span>` : ''}</div></div>`;
  }
  function askCard(a) {
    return `<div class="ask" id="ask-${a.id}"><p>💬 ${esc(a.q)}</p><div class="chips">${(a.opts || []).map(o => `<button class="chip" onclick="answer('${a.id}','${esc(o)}')">${esc(o)}</button>`).join('')}
      <button class="chip" onclick="answerOther('${a.id}')">✏️ อื่นๆ</button></div></div>`;
  }
  async function answer(id, choice, text) {
    try { await run('answerAsk', id, choice, text || ''); toast('ขอบคุณค่ะ 🙏 น้องโชคจะนำไปวิเคราะห์'); B.asks = (B.asks || []).filter(a => a.id !== id); const el = $('ask-' + id); if (el) el.remove(); if (PV) openPlan(PV.plan.id, true); }
    catch (e) { toast(e.message, 1); }
  }
  function answerOther(id) { const t = prompt('เกิดอะไรขึ้น (สั้นๆ)'); if (t) answer(id, 'อื่นๆ', t); }

  // ================= สร้าง / แก้แผน =================
  function newPlan(kind, item) {
    const it = item ? (B.items || []).find(x => x.kind === kind && x.item === item) : null;
    ED = { kind: kind || 'focus', item: item || '', title: item ? item + ' · ' + (kind === 'sales' ? 'เร่งยอดขาย' : 'Att ไม่ถึงเป้า') : '', problem: it ? autoProblem(it) : '', refs: ['📊 Dashboard งานโฟกัส'], refNote: '',
           actions: [{ text: '', scope: 'all', brands: [], owners: [] }], expect: { metric: kind === 'sales' ? 'ach' : 'att', value: it ? (kind === 'sales' ? 100 : it.t) : 0, byDate: '', note: '' }, roundDays: 7, photos: [] };
    REV = null; CUR = it; editView();
  }
  function autoProblem(it) {
    if (it.kind === 'sales') return `${it.item} Achieve ${f1(it.ach)}% · Forecast ${f1(it.fcp)}% · ยอด ${f0(it.v)} / เป้า ${f0(it.t)} บาท (ข้อมูล ${dmy(B.at)})`;
    const lack = (it.brands || []).filter(b => b.need).slice(0, 4);
    return `${it.item} Att ${f1(it.att)}% เป้า ${it.t}% ขาด ${it.need} ชิ้น (${it.c}/${it.b} · ข้อมูล ${dmy(B.at)})${lack.length ? '\nแบรนด์ที่ฉุด: ' + lack.map(b => `${b.brand} ${b.c}/${b.b} ขาด ${b.need}`).join(', ') : ''}`;
  }
  function editPlanView(p) { ED = JSON.parse(JSON.stringify(p)); REV = p.review || null; CUR = (B.items || []).find(x => x.kind === p.kind && x.item === p.item) || null; editView(); }
  function editView() {
    window.scrollTo(0, 0);
    const e = ED, items = B.items || [], active = e.status === 'active';
    const opts = ['focus', 'sales'].map(k => `<optgroup label="${k === 'focus' ? '🎯 งานโฟกัส' : '💰 ยอดขาย (Category)'}">${items.filter(x => x.kind === k).map(x => `<option value="${k}|${esc(x.item)}"${x.kind === e.kind && x.item === e.item ? ' selected' : ''}>${esc(x.item)}${x.fail ? ' ⚠️' : ''}</option>`).join('')}</optgroup>`).join('');
    let h = hero(active ? '✏️ แก้แผนระหว่างรอบ' : e.id ? '📝 แก้ร่างแผน' : '📝 เขียน Action Plan', active ? 'แก้ Action / ผลลัพธ์ที่คาดหวังได้ · Baseline และวันเริ่มรอบไม่เปลี่ยน' : 'กรอก 4 ส่วน แล้วให้น้องโชครีวิวก่อนเริ่ม DAY 1');
    h += noData() + `<div class="grid2"><div class="stack stick"><div class="dk">
        <div class="ch"><b>🔍 ปัญหาจากตัวเลข</b><small>ข้อมูล ${dmy(B.at)}</small></div>
        ${active ? `<div class="chip on" style="margin-bottom:6px">${esc(e.item)}</div>` : `<select class="in" style="background:#2C2C2E;color:#fff;box-shadow:none" onchange="pickItem(this.value)"><option value="">${items.length ? '— เลือกงานโฟกัส / Category —' : '— ยังไม่มีข้อมูล กด 🔄 ดึงข้อมูลด้านบน —'}</option>${opts}</select>`}
        <div id="probBox">${probHTML(CUR)}</div>
        <div id="d0Box"></div>
        ${CUR && B.chokReady ? `<button class="btn g sm" style="margin-top:10px" onclick="chokDay0()">🤖 น้องโชควิเคราะห์ปัญหานี้</button>` : ''}
        <div id="lsBox"></div></div></div>
      <div class="lc">
        <label class="f">ชื่อแผน</label><input class="in" value="${esc(e.title)}" oninput="ED.title=this.value" placeholder="เช่น SIM · VIVO / SAMSUNG ยังไม่มี">
        <div class="step"><i>1</i>ปัญหาที่พบ</div><textarea class="in" oninput="ED.problem=this.value" placeholder="ระบบเติมให้ แก้ / เพิ่มได้">${esc(e.problem)}</textarea>
        <div class="step"><i>2</i>แหล่งที่มาของปัญหา (อ้างอิงจาก)</div>
        <div class="chips">${REFS.map(r => `<button class="chip ${(e.refs || []).includes(r) ? 'on' : ''}" onclick="togRef('${r}')">${r}</button>`).join('')}</div>
        <input class="in" style="margin-top:8px" value="${esc(e.refNote || '')}" oninput="ED.refNote=this.value" placeholder="รายละเอียดเพิ่ม (ถ้ามี)">
        <div class="photos" id="phBox">${(e.photos || []).map((p, i) => `<img src="${esc(p.url)}" onclick="if(confirm('ลบรูปนี้?')){ED.photos.splice(${i},1);editView()}">`).join('')}
          <label class="chip" style="cursor:pointer">📷 แนบรูป<input type="file" accept="image/*" hidden onchange="addPhoto(this.files[0])"></label></div>
        <div class="step"><i>3</i>Action แก้ไขอย่างไร</div>
        <div id="actBox">${e.actions.map(actHTML).join('')}</div>
        <div class="chips"><button class="btn w sm" onclick="ED.actions.push({text:'',scope:'all',brands:[],owners:[]});editView()">+ เพิ่ม Action</button>
          ${B.chokReady ? '<button class="btn sm" onclick="review(1)">✨ ให้น้องโชคแยกเป็นรายแบรนด์</button>' : ''}</div>
        <div class="step"><i>4</i>ผลลัพธ์ที่คาดหวัง</div>${expHTML()}
        ${active ? '' : `<label class="f">ระยะรอบติดตาม</label><div class="chips">${[3, 5, 7, 14].map(d => `<button class="chip ${e.roundDays === d ? 'on' : ''}" onclick="ED.roundDays=${d};editView()">${d} วัน${d === 7 ? ' (แนะนำ)' : ''}</button>`).join('')}</div>`}
        <div id="revBox">${REV ? revHTML(REV) : ''}</div>
        <div class="bar2">
          ${e.id && !active ? '<button class="btn r sm" onclick="delPlan()">🗑️</button>' : ''}
          <button class="btn w" onclick="${active ? `openPlan('${e.id}')` : 'home()'}">ยกเลิก</button>
          ${B.chokReady ? '<button class="btn" onclick="review()">🤖 ให้น้องโชครีวิว</button>' : ''}
          ${active ? '<button class="btn y" onclick="saveActive()">💾 บันทึก</button>' : '<button class="btn w" onclick="saveDraft()">💾 ร่าง</button><button class="btn y" onclick="confirmStart()">🚀 เริ่ม DAY 1</button>'}
        </div></div></div>`;
    $('app').innerHTML = h;
    if (CUR) loadLessons();
  }
  // ยังไม่มีตัวเลขรายวัน (ยังไม่ได้ซิงค์หลังติดตั้ง) → ปุ่มดึงข้อมูลตอนนี้
  function noData() {
    if (B.at && !B.histErr) return '';
    return `<div class="dk rise" style="margin-bottom:14px"><div class="ch"><b>${B.at ? '⚠️ อัปเดตตัวเลขรายวันไม่สำเร็จ' : '📭 ยังไม่มีตัวเลขรายวันให้ Action Plan'}</b></div>
      <div style="font-size:13px;color:#ddd;line-height:1.6">${B.histErr ? 'สาเหตุ: ' + esc(B.histErr) + '<br>' : ''}รายการงานโฟกัส / Category มาจากการซิงค์ Dashboard · กดปุ่มนี้ 1 ครั้ง (ใช้เวลาประมาณ 30–60 วินาที) หรือกด 🚀 ซิงค์ระบบ ใน Google Sheet</div>
      ${B.me.mgr ? '<button class="btn y" style="margin-top:12px" id="rbBtn" onclick="rebuild()">🔄 ดึงข้อมูลตอนนี้</button>' : ''}</div>`;
  }
  async function rebuild() {
    const b = $('rbBtn'); if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> กำลังคำนวณ Dashboard…'; }
    try { B = await run('rebuild'); toast(B.at ? '✅ ได้ข้อมูลถึง ' + dmy(B.at) : 'ยังไม่ได้ข้อมูล', !B.at); if (ED && $('actBox')) { CUR = ED.item ? (B.items || []).find(x => x.kind === ED.kind && x.item === ED.item) : null; editView(); } else home(); }
    catch (e) { toast(e.message, 1); if (b) { b.disabled = false; b.textContent = '🔄 ลองอีกครั้ง'; } }
  }
  function probHTML(it) {
    if (!it) return '<div class="empty" style="color:#AEAEB2">เลือกงานด้านบน เพื่อดูตัวเลข</div>';
    if (it.kind === 'sales') return `<div class="big" style="color:${attCol(it.fcp, 100)}">${f1(it.fcp)}%<small>Forecast</small></div>
      <div class="kp"><div><small>ยอดเดือนนี้</small><b>${kb(it.v)}</b></div><div><small>เป้า</small><b>${kb(it.t)}</b></div><div><small>ขาด</small><b style="color:#FF6961">${kb(it.gap)}</b></div></div>

  function chartSVG(t, sales, target) {
    const S = t.series || []; if (!S.length) return '';

    let g = '';

      else if (sales) g += `<rect x="${X + bw * .18}" y="${H - pb - hb}" width="${bw * .64}" height="${Math.max(2, hb)}" rx="4" fill="${post ? '#FFD60A' : 'rgba(255,255,255,.25)'}"/>`;
      else {
        const hc = (x.c || 0) / mx * (H - pt - pb);
        g += `<rect x="${X + bw * .18}" y="${H - pb - hb}" width="${bw * .64}" height="${Math.max(2, hb)}" rx="4" fill="rgba(255,255,255,.13)"/>`;
        if (x.c) g += `<rect x="${X + bw * .18}" y="${H - pb - hc}" width="${bw * .64}" height="${Math.max(2, hc)}" rx="4" fill="${post ? '#FFD60A' : '#8E8E93'}"/>`;
      }

    });

    return `<svg class="svgc" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>
      <div class="prog-l"><span>${sales ? '▮ ยอดต่อวัน' + (target ? ' · ┅ ยอดที่ควรได้/วัน' : '') : '▮ เหลือง = ชิ้น · ▯ เทา = เครื่อง (ฐาน)'}</span><span>ซ้าย = 7 วันก่อนแผน</span></div>`;

      ${L.map((o, i) => `<tr class="${o.plan ? 'pl' : ''}"><td><b style="font-family:Kanit"><span style="display:inline-block;width:8px;height:8px;border-radius:3px;background:${bcol(o.brand, i)};margin-right:5px"></span>${o.plan ? '✱ ' : ''}${esc(o.brand)}</b></td>
        <td class="pre">${sum(o, 'pre')}</td>${days.map(d => cell(o.days[d])).join('')}${Array.from({ length: Math.max(0, t.roundDays - days.length) }, () => '<td class="c0">·</td>').join('')}<td>${sum(o, 'post')}</td><td>${delta(o)}</td></tr>`).join('')}
      </tbody></table></div><div class="prog-l" style="color:#6E6E73;margin-top:4px"><span>ส้ม = มีเครื่องขายแต่ยังไม่ได้แนบ (โอกาสหลุด)</span><span>${t.allPlan ? '🏪 มี Action ทั้งร้านด้วย' : 'แบรนด์ไม่มี ✱ = ใช้เทียบว่าดีขึ้นตามตลาดไหม'}</span></div>`;

  }
  async function prDraw() {
    document.querySelectorAll('#prG .chip').forEach(c => c.classList.toggle('on', c.getAttribute('onclick').includes(`'${PR.group}'`)));
    if (PR.group === 'CUSTOM') { PR.t = null; PR.blob = null; return prCustom(); }
    $('prBox').innerHTML = '<div class="loading"><span class="spin"></span> กำลังสุ่ม…</div>';
    try { PR.t = await run('drawTopic', PR.group); PR.blob = null; prPaint(); } catch (e) { $('prBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function prPaint() {
    if (PR.group === 'CUSTOM') return prCustom();
    $('prBox').innerHTML = `<div class="topic"><small>หัวข้อที่สุ่มได้</small><b>${esc(PR.t.title)}</b><small>อธิบายให้เพื่อน (ที่เล่นเป็นลูกค้า) ฟัง ไม่เกิน 5 นาที</small></div>
      <button class="btn w sm" style="margin:8px 0" onclick="prDraw()">🎲 สุ่มใหม่</button>
      <div class="rec" id="recV"><video id="vid" playsinline muted autoplay></video><span class="tm" id="recT">0:00</span></div>
      <div class="chips" style="margin-top:10px;justify-content:center" id="recBtns"><button class="btn" onclick="recOpen()">📷 เปิดกล้อง</button>
        <label class="btn w" style="cursor:pointer">📁 เลือกคลิป<input type="file" accept="video/*" hidden onchange="prFile(this.files[0])"></label></div>
      <p style="font-size:11.5px;color:#6E6E73;line-height:1.5;margin:10px 4px 0">🔒 ซ้อมกับเพื่อนในร้านเท่านั้น <b>ห้ามอัดลูกค้าจริง</b> · คลิปส่งให้น้องโชควิเคราะห์แล้วลบทิ้งทันที ไม่เก็บไว้ · ผลเห็นแค่คุณกับผู้จัดการ</p>
      <div id="prRes"></div>`;
  }
  async function recOpen() {
    try {
      const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 360 } }, audio: { echoCancellation: true, noiseSuppression: true } });
      REC = { st, rec: null, chunks: [], t0: 0, tm: null }; $('vid').srcObject = st; $('vid').muted = true;
      $('recBtns').innerHTML = '<button class="btn" style="background:#FF453A;color:#fff" onclick="recGo()">⏺ เริ่มอัด</button>';
    } catch (e) { toast('เปิดกล้อง/ไมค์ไม่ได้ — อนุญาตกล้องและไมค์ หรือเลือกคลิปแทน', 1); }
  }
  function recGo() {
    const mt = ['video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    try { REC.rec = new MediaRecorder(REC.st, Object.assign({ videoBitsPerSecond: 500000, audioBitsPerSecond: 64000 }, mt ? { mimeType: mt } : {})); } catch (e) { return toast('เครื่องนี้อัดในแอปไม่ได้ — เลือกคลิปแทน', 1); }
    REC.chunks = []; REC.rec.ondataavailable = e => e.data && e.data.size && REC.chunks.push(e.data);
    REC.rec.onstop = () => { const type = (REC.rec.mimeType || mt || 'video/webm').split(';')[0]; PR.blob = new Blob(REC.chunks, { type }); PR.mime = type; PR.sec = Math.round((Date.now() - REC.t0) / 1000); recStop(true); prReady(); };
    REC.rec.start(1000); REC.t0 = Date.now(); $('recT').classList.add('on');
    REC.tm = setInterval(() => { const s = Math.round((Date.now() - REC.t0) / 1000); $('recT').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; if (s >= 300) recEnd(); }, 300);
    $('recBtns').innerHTML = '<button class="btn" onclick="recEnd()">⏹ หยุด</button>';
  }
  function recEnd() { if (REC && REC.rec && REC.rec.state !== 'inactive') REC.rec.stop(); }
  function recStop(keepBlob) { if (!REC) return; clearInterval(REC.tm); try { REC.st.getTracks().forEach(t => t.stop()); } catch (e) {} if (REC.rec && REC.rec.state !== 'inactive' && !keepBlob) try { REC.rec.stop(); } catch (e) {} REC = null; }
  // คลิปจากเครื่อง: ≤ 150MB ส่งได้เลย (อัปเป็นท่อน) · ใหญ่กว่านั้นย่อในแอปก่อน (ถ้าเครื่องรองรับ) · สูงสุด 500MB
  async function prFile(f) {
    if (!f) return; PR.sec = 0;
    if (f.size > VMAX && !(document.createElement('video').captureStream)) return toast('คลิปใหญ่เกิน 500MB — ตัดให้สั้นลง หรืออัดในแอป', 1);
    if (f.size <= 150 * 1024 * 1024) { PR.blob = f; PR.mime = f.type || 'video/mp4'; return prReady(); }
    const v = document.createElement('video'); v.src = URL.createObjectURL(f); v.playsInline = true; v.muted = false; v.volume = 0.0001;
    if (!v.captureStream && !v.mozCaptureStream) { if (f.size > VMAX) return toast('คลิปใหญ่เกิน 500MB — ตัดให้สั้นลง', 1); PR.blob = f; PR.mime = f.type || 'video/mp4'; return prReady(); }
    try {
      await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = () => no(new Error('เปิดคลิปไม่ได้')); });
      if (v.duration > 600) return toast('คลิปยาวเกิน 10 นาที — ตัดให้สั้นลง หรืออัดในแอป', 1);
      const c = document.createElement('canvas'), k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)); c.width = Math.round(v.videoWidth * k / 2) * 2; c.height = Math.round(v.videoHeight * k / 2) * 2;
      const g = c.getContext('2d'), vs = c.captureStream(24), src = (v.captureStream || v.mozCaptureStream).call(v);
      src.getAudioTracks().forEach(t => vs.addTrack(t));
      const mt = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
      const rec = new MediaRecorder(vs, Object.assign({ videoBitsPerSecond: 500000, audioBitsPerSecond: 64000 }, mt ? { mimeType: mt } : {})), ch = [];
      rec.ondataavailable = e => e.data && e.data.size && ch.push(e.data);
      $('recBtns').innerHTML = '<span class="btn w" id="cmpT"><span class="spin"></span> กำลังย่อคลิป…</span>';
      const done = new Promise(ok => { rec.onstop = ok; });
      let raf; const draw = () => { g.drawImage(v, 0, 0, c.width, c.height); $('cmpT') && ($('cmpT').innerHTML = `<span class="spin"></span> กำลังย่อคลิป ${Math.round(v.currentTime)}/${Math.round(v.duration)} วิ`); raf = requestAnimationFrame(draw); };
      rec.start(1000); await v.play(); draw();
      await new Promise(ok => { v.onended = ok; }); rec.stop(); cancelAnimationFrame(raf); await done;
      const type = (rec.mimeType || mt || 'video/webm').split(';')[0]; PR.blob = new Blob(ch, { type }); PR.mime = type; PR.sec = Math.round(v.duration);
      if (PR.blob.size > VMAX) return toast('ย่อแล้วยังใหญ่เกิน 500MB — ตัดให้สั้นลง', 1);
      prReady();
    } catch (e) { toast('ย่อคลิปไม่สำเร็จ: ' + e.message, 1); prPaint(); }
  }
  function prReady() {
    const u = URL.createObjectURL(PR.blob), v = $('vid'); if (v) { v.srcObject = null; v.src = u; v.muted = false; v.controls = true; v.style.transform = 'none'; }
    $('recT').classList.remove('on'); $('recT').textContent = `${(PR.blob.size / 1048576).toFixed(1)} MB`;
    $('recBtns').innerHTML = `<button class="btn w" onclick="prPaint()">↺ อัดใหม่</button><button class="btn y" id="prSend" onclick="prSend()">🤖 ส่งให้น้องโชค</button>`;
  }
  const VMAX = 500 * 1024 * 1024;
  const b64of = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
  async function prSend() {
    if (PR.group === 'CUSTOM') {
      PR.title = ($('prTi') || {}).value || PR.title; PR.facts = ($('prFa') || {}).value || PR.facts;
      if (!String(PR.title).trim()) { toast('ใส่ว่าฝึกเรื่องอะไรก่อน', 1); $('prTi') && $('prTi').focus(); return; }
      PR.t = { title: PR.title.trim(), facts: PR.facts.trim(), group: 'CUSTOM' };
    }
    PR.t.who = PR.who;
    const b = $('prSend'); b.disabled = true; b.innerHTML = '<span class="spin"></span> น้องโชคกำลังดูคลิป (30–60 วิ)…';
    try {
      let vid;
      if (PR.blob.size <= 12 * 1024 * 1024) vid = { mime: PR.mime, b64: await b64of(PR.blob) };   // คลิปเล็ก: ส่งทีเดียว
      else {
        // คลิปใหญ่: อัปเป็นท่อน 8MB ตรงไปให้น้องโชค (ไม่เก็บที่ไหน ลบทิ้งหลังวิเคราะห์)
        const mb = x => (x / 1048576).toFixed(0), tot = PR.blob.size;
        b.innerHTML = '<span class="spin"></span> เริ่มอัปโหลด…';
        const st = await run('videoStart', PR.pid, PR.aid, tot, PR.mime), CH = st.chunk || 8388608;
        for (let off = 0; off < tot; off += CH) {
          b.innerHTML = `<span class="spin"></span> อัปโหลด ${mb(off)}/${mb(tot)} MB`;
          const b64 = await b64of(PR.blob.slice(off, Math.min(tot, off + CH)));
          let ok = false, err;
          for (let k = 0; k < 3 && !ok; k++) { try { await run('videoChunk', st.sid, off, b64); ok = true; } catch (e) { err = e; if (/ไม่ต่อเนื่อง|หมดเวลา|ไม่ใช่/.test(e.message)) break; await new Promise(r => setTimeout(r, 1500 * (k + 1))); } }
          if (!ok) throw err;
        }
        vid = { mime: PR.mime, sid: st.sid };
        b.innerHTML = '<span class="spin"></span> น้องโชคกำลังดูคลิป (1–2 นาที)…';
      }
      const r = await run('chokVideo', PR.pid, PR.aid, PR.t, vid);
      $('recBtns').innerHTML = `<button class="btn w" onclick="prDraw()">🎲 ฝึกหัวข้อใหม่</button><button class="btn" onclick="closeS('sh1');${PV ? `openPlan('${PR.pid}',true)` : 'refresh().then(home)'}">เสร็จ</button>`;
      $('prRes').innerHTML = `<div class="rev"><div class="ch"><b>🤖 ผลจากน้องโชค</b><small>${esc(PR.t.title)}</small></div>${vidHTML(r.res)}
        ${PR.t.facts ? '' : '<div style="font-size:11.5px;color:#6E6E73;margin-top:6px">ไม่ได้ใส่ข้อมูลที่ถูกต้อง — น้องโชคดูแค่วิธีพูด ไม่ได้ตรวจตัวเลข/โปร</div>'}
        <details style="margin-top:8px;${PR.t.facts ? '' : 'display:none'}"><summary style="font-weight:700;font-size:12.5px;cursor:pointer">📄 ดูข้อมูลที่ถูกต้องของหัวข้อนี้</summary><div style="white-space:pre-wrap;font-size:12.5px;margin-top:6px">${esc(PR.t.facts)}</div></details></div>`;
      $('prRes').scrollIntoView({ behavior: 'smooth' }); vib(20);
    } catch (e) {
      b.disabled = false; b.textContent = '🤖 ส่งอีกครั้ง';
      const net = /Failed to fetch|NetworkError|Load failed/i.test(e.message);
      $('prRes').innerHTML = `<div class="rev"><b>⚠️ น้องโชคยังดูคลิปไม่ได้</b><div style="font-size:12.5px;margin-top:4px;white-space:pre-wrap">${esc(e.message)}${net ? '\n→ เน็ตหลุดระหว่างส่ง ต่อ Wi-Fi แล้วกดส่งอีกครั้ง' : ''}</div><div style="font-size:11.5px;color:#6E6E73;margin-top:6px">ขนาดคลิป ${(PR.blob.size / 1048576).toFixed(1)} MB · ${esc(PR.mime)}</div></div>`;
    }
  }
  function vidHTML(r) {
    r = r || {}; const li = (a, ic) => (a || []).length ? `<ul>${a.map(x => `<li>${ic} ${esc(x)}</li>`).join('')}</ul>` : '';
    return `<div class="vres">${r.total ? `<b style="font-family:Kanit;font-size:16px">ครอบคลุม ${r.hit || 0}/${r.total} จุด</b>${r.seconds ? ` · ⏱️ ${r.seconds} วินาที` : ''}` : ''}
      ${li(r.covered, '✅')}${li(r.missing, '⚠️')}${li(r.wrong, '❌')}${r.unclear ? `<div style="font-size:12px;color:#6E6E73">🔇 ${esc(r.unclear)}</div>` : ''}
      ${r.tip ? `<div style="margin-top:6px">💡 <b>ลองพูดแบบนี้:</b> ${esc(r.tip)}</div>` : ''}${r.next ? `<div>🎯 ${esc(r.next)}</div>` : ''}</div>`;
  }

  // ================= 🏁 จบรอบ =================
  let ER = null;
  async function endRoundS() {
    const p = PV.plan; ER = { result: '', lesson: '', next: 'close', days: p.roundDays || 7 };
    openS('sh1', `<div class="sh-h"><b>🏁 จบรอบ ${p.rounds.length}</b><button class="x" onclick="closeS('sh1')">✕</button></div><div id="erBox"><div class="loading"><span class="spin"></span> น้องโชคกำลังสรุปผลรอบ…</div></div>`);
    if (PV.chokReady) { try { const r = await run('chokRound', p.id); ER.result = r.result || ''; ER.lesson = r.lesson || ''; ER.next = { continue: 'continue', expand: 'expand', adjust: 'continue', close: 'close' }[r.nextChoice] || 'close'; ER.chok = r; } catch (e) { ER.err = e.message; } }
    erPaint();
  }
  function erPaint() {
    const r = ER.chok;
    $('erBox').innerHTML = `${r ? `<div class="chok" style="background:var(--d);color:#fff"><div class="who"><i>🤖</i>น้องโชคสรุปรอบนี้</div><b>${esc(r.headline || '')}</b>\n${esc(r.why || '')}\n➡️ ${esc(r.next || '')}</div>` : ER.err ? `<div class="chok" style="background:var(--d);color:#fff">⚠️ ${esc(ER.err)}</div>` : ''}
      <label class="f">ผลของรอบนี้</label><div class="chips">${Object.keys(RES).map(k => `<button class="chip ${ER.result === k ? 'on' : ''}" onclick="ER.result='${k}';erPaint()">${RES[k]}</button>`).join('')}</div>
      <label class="f">บทเรียน (เก็บเข้าคลัง ใช้ครั้งหน้า)</label><textarea class="in" oninput="ER.lesson=this.value">${esc(ER.lesson)}</textarea>
      <label class="f">ต่อจากนี้</label><div class="chips">${[['continue', '🔄 ต่อรอบใหม่'], ['expand', '➕ ขยายไปแบรนด์อื่น'], ['extend', '⏩ ขยายเวลารอบนี้'], ['close', '🏁 ปิดงาน']].map(x => `<button class="chip ${ER.next === x[0] ? 'on' : ''}" onclick="ER.next='${x[0]}';erPaint()">${x[1]}</button>`).join('')}</div>
      ${ER.next !== 'close' ? `<label class="f">${ER.next === 'extend' ? 'ขยายอีกกี่วัน' : 'รอบใหม่กี่วัน'}</label><div class="chips">${[3, 5, 7, 14].map(d => `<button class="chip ${ER.days === d ? 'on' : ''}" onclick="ER.days=${d};erPaint()">${d} วัน</button>`).join('')}</div>` : ''}
      ${ER.next === 'expand' ? '<p style="font-size:12px;color:#6E6E73">หลังเริ่มรอบใหม่ กด ✏️ แก้แผน เพื่อเพิ่มแบรนด์ / Action ได้เลย</p>' : ''}
      <button class="btn y blk" style="margin-top:16px" id="erB" onclick="doEndRound()">ยืนยัน</button>`;
  }
  async function doEndRound() {
    if (ER.next === 'close' && !ER.result) return toast('เลือกผลของรอบนี้ก่อน', 1);
    const b = $('erB'); b.disabled = true;
    try { await run('endRound', PV.plan.id, { result: ER.result, lesson: ER.lesson, next: ER.next, days: ER.days }); closeS('sh1'); toast(ER.next === 'close' ? '🏁 ปิดงานแล้ว' : '🔄 เริ่มรอบใหม่แล้ว'); await refresh(); openPlan(PV.plan.id); }
    catch (e) { b.disabled = false; toast(e.message, 1); }
  }

  // ================= ⚙️ ตั้งค่า =================
  let ST = null;
  async function openSettings() {
    openS('sh1', '<div class="loading"><span class="spin"></span></div>');
    let c = null; try { if (B.me.admin) c = await run('chokSettings'); } catch (e) {}
    ST = { topics: JSON.parse(JSON.stringify(B.topics || [])), c };
    stPaint();
  }
  function stPaint() {
    const c = ST.c;
    $('sh1b').innerHTML = `<div class="sh-h"><b>⚙️ ตั้งค่า Action Plan</b><button class="x" onclick="closeS('sh1')">✕</button></div>
      ${c ? `<div class="lc" style="box-shadow:none"><div class="ch"><b>🤖 สมองน้องโชค (Gemini API)</b><small>${c.hasKey ? 'ตั้งแล้ว ••••' + esc(c.keyTail) : 'ยังไม่ได้ตั้ง'}</small></div>
        <input class="in" id="stK" type="password" placeholder="${c.hasKey ? 'ใส่ใหม่เพื่อเปลี่ยน' : 'วาง API key (ขึ้นต้น AIza…)'}">
        <input class="in" id="stM" style="margin-top:8px" value="${esc(c.model)}" placeholder="รุ่น เช่น gemini-2.5-flash">
        <div class="chips" style="margin-top:8px"><button class="btn sm" onclick="stSaveKey()">💾 บันทึก</button><button class="btn w sm" onclick="stTest()">🧪 ทดสอบ</button></div>
        <p style="font-size:11.5px;color:#6E6E73;line-height:1.5;margin:8px 2px 0">สร้าง key ฟรีที่ aistudio.google.com ด้วยบัญชี Super App · เก็บใน Script Properties ไม่อยู่ในโค้ด / GitHub · ส่งให้ AI แค่ตัวเลขร้าน + ข้อความในแผน ไม่มีข้อมูลลูกค้า</p><div id="stR"></div></div>` : ''}
      <div class="lc" style="box-shadow:none;margin-top:12px"><div class="ch"><b>🎲 หัวข้อฝึกพูด</b><small>สุ่มในกลุ่มเดียวกัน · โปรเครื่องสุ่มจากชีต Promotion ให้เอง</small></div>
        ${ST.topics.map((t, i) => `<div class="act"><div class="top"><input class="in" style="padding:8px 12px" value="${esc(t.group)}" placeholder="กลุ่ม เช่น ซิมรายเดือน" oninput="ST.topics[${i}].group=this.value"><button class="x" onclick="ST.topics.splice(${i},1);stPaint()">✕</button></div>
          <input class="in" value="${esc(t.title)}" placeholder="ชื่อหัวข้อ เช่น ทรู 599 + ลดเครื่อง 3,000" oninput="ST.topics[${i}].title=this.value">
          <textarea class="in" style="margin-top:6px" placeholder="ข้อมูลที่ถูกต้อง (น้องโชคใช้เทียบ) เช่น ค่าบริการ 599/เดือน · สัญญา 12 เดือน · ยกเลิกก่อนเสียค่าปรับ…" oninput="ST.topics[${i}].facts=this.value">${esc(t.facts)}</textarea></div>`).join('')}
        <div class="chips"><button class="btn w sm" onclick="ST.topics.push({group:(ST.topics[ST.topics.length-1]||{}).group||'',title:'',facts:''});stPaint()">+ เพิ่มหัวข้อ</button><button class="btn sm" onclick="stSaveTopics()">💾 บันทึกหัวข้อ</button></div></div>`;
  }
  async function stSaveKey() { try { ST.c = await run('saveChokSettings', { key: $('stK').value, model: $('stM').value }); B.chokReady = ST.c.hasKey; stPaint(); toast('💾 บันทึกแล้ว'); } catch (e) { toast(e.message, 1); } }
  async function stTest() { $('stR').innerHTML = '<div class="chok"><span class="spin"></span></div>'; try { const r = await run('testChok'); $('stR').innerHTML = `<div class="chok"><div class="who"><i>🤖</i>น้องโชค</div>${esc(r.text)}</div>`; } catch (e) { $('stR').innerHTML = `<div class="chok">⚠️ ${esc(e.message)}</div>`; } }
  async function stSaveTopics() { try { B.topics = await run('saveTopics', ST.topics); ST.topics = JSON.parse(JSON.stringify(B.topics)); stPaint(); toast('💾 บันทึกหัวข้อแล้ว'); } catch (e) { toast(e.message, 1); } }

  window.addEventListener('message', e => { if (e.data && e.data.type === 'sys1326-show' && B) refresh().then(() => { if (PV) openPlan(PV.plan.id, true); else if (!ED || !$('actBox')) home(); }); });
  boot();
</script>
